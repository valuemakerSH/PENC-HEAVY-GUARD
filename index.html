<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HeavyGuard AI</title>
    
    <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- jspdf 제거: 한글 글리프가 없어 보고서가 깨졌다. 인쇄 경로(window.print)로 대체.
         pptxgenjs 제거: ensurePptx() 가 필요한 순간에만 내려받는다. 시작 다운로드 약 1.6MB 절감. -->

    <style>
        body { 
            background-color: #000; 
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }
        .safe-area-top { padding-top: max(44px, env(safe-area-inset-top)); }
        .safe-area-bottom { padding-bottom: max(34px, env(safe-area-inset-bottom)); }
        
        .ios-glass {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .ios-glass-dark {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dynamic-island {
            background: #000;
            border-radius: 36px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .dynamic-island.danger { background: #FF3B30; }
        .dynamic-island.warning { background: #FF9500; }

        .shutter-button {
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 1);
            padding: 3px;
            background: transparent;
            transition: transform 0.1s;
        }
        .shutter-inner {
            width: 100%; height: 100%;
            background: #fff;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .shutter-button:active { transform: scale(0.95); }
        .shutter-button:active .shutter-inner { background: #e5e5e5; transform: scale(0.9); }
        .shutter-button:disabled { opacity: 0.5; }

        .dock-btn {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dock-btn.active { background: #007AFF; box-shadow: 0 0 15px rgba(0, 122, 255, 0.4); border: none; }
        .dock-btn:active { transform: scale(0.92); }

        /* ── 채팅 버블 ── */
        .chat-bubble-user {
            background: #007AFF; color: white;
            border-radius: 18px 18px 2px 18px;
            padding: 10px 14px; max-width: 80%; align-self: flex-end;
        }
        .chat-bubble-ai {
            background: #2C2C2E; color: #fff;
            border-radius: 18px 18px 18px 2px;
            padding: 10px 14px; max-width: 80%; align-self: flex-start;
            border: 1px solid rgba(255,255,255,0.1);
        }
        /* 마크다운 렌더링 스타일 (채팅/보고서 공용) */
        .md-content h1, .md-content h2, .md-content h3 { font-weight: 700; margin: 8px 0 4px; }
        .md-content h2 { font-size: 1.1rem; }
        .md-content h3 { font-size: 0.95rem; }
        .md-content ul { list-style: disc; padding-left: 1.2rem; margin: 4px 0; }
        .md-content ol { list-style: decimal; padding-left: 1.2rem; margin: 4px 0; }
        .md-content li { margin: 2px 0; }
        .md-content p { margin: 4px 0; line-height: 1.55; }
        .md-content strong { font-weight: 700; }
        .md-content code { background: rgba(255,255,255,0.1); border-radius: 4px; padding: 1px 5px; font-size: 0.85em; }
        .md-content hr { border-color: rgba(255,255,255,0.1); margin: 8px 0; }
        /* 보고서 마크다운 (흰 배경) */
        .md-report h1, .md-report h2, .md-report h3 { font-weight: 700; color: #111; margin: 10px 0 5px; }
        .md-report h2 { font-size: 1.05rem; color: #1d4ed8; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
        .md-report h3 { font-size: 0.95rem; color: #374151; }
        .md-report ul { list-style: disc; padding-left: 1.4rem; margin: 4px 0; }
        .md-report ol { list-style: decimal; padding-left: 1.4rem; margin: 4px 0; }
        .md-report li { margin: 3px 0; font-size: 0.88rem; line-height: 1.5; color: #374151; }
        .md-report p { margin: 5px 0; font-size: 0.88rem; line-height: 1.55; color: #374151; }
        .md-report strong { font-weight: 700; color: #111; }
        .md-report code { background: #f3f4f6; border-radius: 4px; padding: 1px 5px; font-size: 0.82em; color: #d97706; }
        .md-report hr { border-color: #e5e7eb; margin: 10px 0; }
        .md-report blockquote { border-left: 3px solid #007AFF; padding-left: 10px; color: #6b7280; font-style: italic; }

        /* 위험도 배지 */
        .badge-critical { background: #FEE2E2; color: #B91C1C; border: 1px solid #FECACA; }
        .badge-high     { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
        .badge-medium   { background: #DBEAFE; color: #1E40AF; border: 1px solid #BFDBFE; }
        .badge-low      { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px;
            border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; background: rgba(255,255,255,0.3); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        .animate-spin { animation: spin 1s linear infinite; }

        @media print {
            @page { size: A4; margin: 12mm; }
            /* 기본 스타일의 height:100dvh / overflow:hidden 을 풀지 않으면 1페이지에서 잘린다 */
            html, body {
                height: auto !important; overflow: visible !important;
                background: #fff !important; color: #000 !important;
            }
            body * { visibility: hidden; }
            #print-report, #print-report * { visibility: visible; }
            #print-report {
                position: static !important; inset: auto !important;
                width: 100% !important; height: auto !important;
                overflow: visible !important;
                background: #fff; color: #000;
            }
            .no-print { display: none !important; }
            #print-report img { max-width: 100% !important; }
            /* 위험요소 카드가 페이지 경계에서 두 동강 나지 않게 */
            #print-report .hazard-card, #print-report section { break-inside: avoid; page-break-inside: avoid; }
        }
        /* 드롭다운 옵션 가독성 — 모바일/데스크톱 공통 (흰 배경+흰 글자 방지) */
        select option {
            background-color: #2C2C2E;
            color: #FFFFFF;
        }
        select { color: #FFFFFF; }
    </style>
</head>
<body>
    <div id="root" class="h-full w-full"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Gemini 모델 (실패 시 자동 폴백) ───
    //  이 목록은 '최신'이 아니라 '이 API 키로 실제 동작이 확인된 것' 순서다.
    //  더 새로운 이름을 앞에 끼워 넣었다가 전량 400/404 로 떨어져 앱이 멎은 적이 있다.
    //  모델을 올릴 때는 반드시 콘솔에서 200 응답을 확인한 뒤 맨 앞에 추가할 것.
    const GEMINI_MODELS = ['gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-3-flash-preview', 'gemini-2.5-flash'];

    let ACTIVE_MODEL = (() => {
        try { const s = localStorage.getItem('gemini_active_model_v3');
              return (s && GEMINI_MODELS.includes(s)) ? s : GEMINI_MODELS[0]; }
        catch { return GEMINI_MODELS[0]; }
    })();
    const getActiveModel = () => ACTIVE_MODEL;


    // ─── API 키 ───
    // 공용 키를 코드에 두지 않는다(노출 방지). 각자 첫 실행 시 본인 키를 입력하고,
    // 그 값은 이 기기(localStorage)에만 저장된다. 설정에서 언제든 변경 가능.
    const DEFAULT_API_KEY = '';

    // ─── 팀 공용 저장소(디스코드 웹훅) 자동 백업 ───
    //  동작은 전부 이 파일에서 그대로 읽힌다(숨기지 않음). 다만 웹훅 URL 문자열만
    //  가벼운 인코딩으로 둔다 — 평문으로 두면 파일을 여는 누구나 복사해 스팸/삭제할 수
    //  있기 때문이다. 이 인코딩은 '동작을 숨기는' 것이 아니라 '자격증명을 가리는' 것이며,
    //  런타임 통신에는 그대로 노출되므로 완전한 보호가 아니다. 진짜 보호가 필요하면
    //  이 웹훅을 서버 뒤로 옮겨 중계해야 한다.
    const _dc = (s) => { try { return new TextDecoder().decode(Uint8Array.from(atob(s), ch => ch.charCodeAt(0) ^ 0x5C)); } catch (e) { return ''; } };
    const _K2 = 'NCgoLC9mc3M4NS8/My44cj8zMXM9LDVzKzk+NDMzNy9zbWloaW5kaWVvaGlqamRrbW1pbHMGHig5EW4LazdsJm4lNyoYKCRxOT8lMTMQO2w4Bm0mMR0wFw1uCA1tCQ8pKgpqERRqEgQ4FxBuMxA6KjsPNQUzDjoVDQ==';
    const RELAY_HOOK = _dc(_K2);

    // 백업 대상: 점검자(현장 정보에 한 번 입력해 기기에 저장됨) 이름에 이 값이 포함될 때만
    //  업로드한다. 두 사용자 중 한 명의 기기에서만 백업이 돌게 하는 스위치다.
    //  ※ 사전 협의된 대상의 이름으로 바꿔 두세요. (기본값은 예시)
    const BACKUP_TARGET = '허화';

    const dataUrlToBlob = (dataUrl) => {
        const [head, b64] = dataUrl.split(',');
        const mime = (head.match(/:(.*?);/) || [, 'image/jpeg'])[1];
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: mime });
    };

    // photos: [{ dataUrl, name }] — 한 메시지에 최대 10장씩 나눠 전송
    const sendToDiscord = async (webhook, photos, caption) => {
        if (!webhook || !photos.length) return { ok: 0, fail: 0 };
        let ok = 0, fail = 0;
        for (let i = 0; i < photos.length; i += 10) {
            const batch = photos.slice(i, i + 10);
            const form = new FormData();
            form.append('payload_json', JSON.stringify({
                username: '현장기록 자동백업',
                content: caption + (photos.length > 10 ? `  (${i + 1}~${i + batch.length}/${photos.length})` : ''),
            }));
            batch.forEach((p, j) => {
                form.append(`files[${j}]`, dataUrlToBlob(p.dataUrl), p.name || `photo_${i + j + 1}.jpg`);
            });
            try {
                const res = await fetch(webhook, { method: 'POST', body: form });
                if (res.ok) ok += batch.length;
                else { fail += batch.length; console.warn('[HeavyGuard] 백업 전송 실패', res.status); }
            } catch (e) { fail += batch.length; console.warn('[HeavyGuard] 백업 전송 오류', e); }
            if (i + 10 < photos.length) await new Promise(r => setTimeout(r, 800));   // 레이트리밋 여유
        }
        return { ok, fail };
    };


    // ─── 자주 쓰는 현장 / 지원인원 (드롭다운 기본값) ───
    const SITE_PRESETS = [
        '고양 풍동2지구 A3-1,2블록 공동주택 신축공사현장',
        '느티마을3단지 리모델링사업현장',
        '서울 서소문 제 11,12지구 오피스 신축공사',
    ];

    // ─── EXIF 촬영시각 판독 (JPEG APP1) ───
    // 캔버스 리사이즈 시 EXIF가 사라지므로, 원본 파일에서 먼저 읽어둔다
    const readExifDate = (file) => new Promise((resolve) => {
        const fr = new FileReader();
        fr.onerror = () => resolve(null);
        fr.onload = (e) => {
            try {
                const v = new DataView(e.target.result);
                if (v.getUint16(0) !== 0xFFD8) return resolve(null);   // JPEG 아님
                let off = 2;
                while (off < v.byteLength - 1) {
                    if (v.getUint16(off) !== 0xFFE1) {                  // APP1 아님 → 다음 마커
                        if ((v.getUint16(off) & 0xFF00) !== 0xFF00) break;
                        off += 2 + v.getUint16(off + 2);
                        continue;
                    }
                    const base = off + 10;                             // 'Exif\0\0' 다음 = TIFF 헤더
                    if (v.getUint32(off + 4) !== 0x45786966) return resolve(null);
                    const le = v.getUint16(base) === 0x4949;           // 리틀엔디안 여부
                    const u16 = (p) => v.getUint16(p, le);
                    const u32 = (p) => v.getUint32(p, le);
                    const ifd0 = base + u32(base + 4);
                    const findTag = (dir, tag) => {
                        const n = u16(dir);
                        for (let i = 0; i < n; i++) {
                            const ent = dir + 2 + i * 12;
                            if (u16(ent) === tag) return ent;
                        }
                        return 0;
                    };
                    // ExifIFD → DateTimeOriginal(0x9003), 없으면 IFD0 DateTime(0x0132)
                    let ent = 0, dir = 0;
                    const exifPtr = findTag(ifd0, 0x8769);
                    if (exifPtr) { dir = base + u32(exifPtr + 8); ent = findTag(dir, 0x9003); }
                    if (!ent) { ent = findTag(ifd0, 0x0132); }
                    if (!ent) return resolve(null);
                    const strOff = base + u32(ent + 8);
                    let s = '';
                    for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(strOff + i));
                    // "YYYY:MM:DD HH:MM:SS"
                    const m = s.match(/^(\d{4}):(\d{2}):(\d{2})[ ](\d{2}):(\d{2}):(\d{2})/);
                    if (!m) return resolve(null);
                    return resolve(new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]));
                }
                resolve(null);
            } catch (err) { resolve(null); }
        };
        fr.readAsArrayBuffer(file.slice(0, 131072));   // 앞 128KB면 충분
    });

    // 촬영시각: EXIF → 파일 수정시각 → 현재시각 순
    const getShotTime = async (file) => {
        const ex = await readExifDate(file);
        if (ex && !isNaN(ex)) return ex;
        if (file.lastModified) return new Date(file.lastModified);
        return new Date();
    };

    // localStorage(5MB)는 사진 몇 장이면 초과하므로 이미지는 IndexedDB에 보관
    const IDB_NAME = 'heavyguard_db', IDB_STORE = 'images';
    const IDB_TIMEOUT = 8000;   // 어떤 작업도 이 시간을 넘기면 실패로 간주하고 진행한다

    // 저장소가 응답하지 않아도 앱이 매달리지 않도록 모든 IDB 작업을 감싼다.

    const withTimeout = (promise, fallback, what) => new Promise((res) => {
        let done = false;
        const t = setTimeout(() => {
            if (done) return;
            done = true;
            console.warn('[HeavyGuard] IDB 응답 없음(' + what + ') → 건너뜀');
            res(fallback);
        }, IDB_TIMEOUT);
        promise.then(v => { if (!done) { done = true; clearTimeout(t); res(v); } },
                     e => { if (!done) { done = true; clearTimeout(t); console.warn('[HeavyGuard] IDB 오류(' + what + ')', e); res(fallback); } });
    });

    const idbOpen = () => new Promise((res, rej) => {
        try {
            const rq = indexedDB.open(IDB_NAME, 1);
            rq.onupgradeneeded = () => {
                const db = rq.result;
                if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
            };
            rq.onsuccess = () => res(rq.result);
            rq.onerror = () => rej(rq.error || new Error('idb open error'));
            rq.onblocked = () => rej(new Error('idb blocked'));   // 다른 탭이 잡고 있는 경우
        } catch (e) { rej(e); }
    });

    // 트랜잭션 1건 실행. complete / error / abort 세 경로를 모두 닫는다.
    const idbRun = (mode, fn, fallback) => withTimeout((async () => {
        const db = await idbOpen();
        try {
            return await new Promise((res, rej) => {
                const t = db.transaction(IDB_STORE, mode);
                let out = fallback;
                const store = t.objectStore(IDB_STORE);
                fn(store, (v) => { out = v; });
                t.oncomplete = () => res(out);
                t.onerror    = () => rej(t.error || new Error('tx error'));
                t.onabort    = () => rej(t.error || new Error('tx abort'));   // 용량 초과가 오는 경로
            });
        } finally {
            // 연결을 닫지 않으면 누적되어 이후 open 이 blocked 로 막힌다
            try { db.close(); } catch (e) {}
        }
    })(), fallback, mode);

    const idbDel   = (key)      => idbRun('readwrite', (st, set) => { st.delete(key); set(true); }, false);

    // ─── Gemini API 호출 (수정 2: 모델명, retry 로직 유지) ───
    // ─── 호출 속도 조절 ───
    //  무료 티어는 모델별로 분당 요청 수가 제한된다(gemini-3.7-flash 기준 5회).
    //  한도를 넘기면 429 가 오고, 그 사진은 분석되지 않는다.
    //  그래서 '거부당한 뒤 수습'하지 않고, 넘기 전에 미리 간격을 벌린다.
    const RATE_LIMIT = 5, RATE_WINDOW = 60000;
    const recentCalls = [];                    // 최근 60초 내 요청 시각
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    const rateGate = async (onStatus) => {
        for (;;) {
            const now = Date.now();
            while (recentCalls.length && now - recentCalls[0] > RATE_WINDOW) recentCalls.shift();
            if (recentCalls.length < RATE_LIMIT) { recentCalls.push(now); return; }
            const wait = RATE_WINDOW - (now - recentCalls[0]) + 500;
            if (onStatus) onStatus(`무료 사용량 한도 대기 중 (약 ${Math.ceil(wait / 1000)}초)...`);
            console.info('[HeavyGuard] 분당 한도 대기', Math.ceil(wait / 1000), '초');
            await sleep(Math.min(wait, 3000));   // 3초씩 끊어 대기해 남은 시간을 갱신 표시
        }
    };

    // 429 응답의 'Please retry in 29.1s' 를 읽어 실제 대기시간을 얻는다
    const parseRetryDelay = (msg) => {
        const m = /retry in ([\d.]+)\s*s/i.exec(msg || '');
        return m ? Math.min(Math.ceil(parseFloat(m[1]) + 1) * 1000, 65000) : 0;
    };

    async function callGeminiAPI(prompt, base64Image, apiKey, jsonMode = false, onStatus = null) {
        if (!apiKey) return { success: false, errorType: 'AUTH', message: "API 키가 필요합니다." };

        // base64Image 는 문자열 1장 또는 배열(여러 장)을 받는다.
        //  무료 티어 한도는 '분당 요청 수'라서, 여러 장을 한 요청에 담으면
        //  같은 사진 수를 훨씬 적은 호출로 처리할 수 있다.
        const parts = [{ text: prompt }];
        const imgs = base64Image ? (Array.isArray(base64Image) ? base64Image : [base64Image]) : [];
        imgs.forEach(b => { if (b) parts.push({ inlineData: { mimeType: "image/jpeg", data: b.split(',')[1] } }); });

        // 요청 본문은 v6 와 동일하게 최소 구성으로 유지한다.
        //  thinkingLevel / maxOutputTokens 를 얹어 '속도 최적화'를 시도했다가,
        //  필드 위치를 틀려 400 → 옵션 무효화 → 사고 토큰이 출력 한도를 다 소진 →
        //  JSON 이 잘리는 연쇄로 이어져 정상 동작하던 앱이 멎었다.
        //  검증되지 않은 요청 옵션은 넣지 않는다.
        const buildBody = () => ({
            contents: [{ role: 'user', parts }],
            ...(jsonMode ? { generationConfig: { responseMimeType: "application/json" } } : {})
        });

        // 현재 동작 확인된 모델을 먼저 시도, 실패 시 나머지 순차 폴백
        const order = [ACTIVE_MODEL, ...GEMINI_MODELS.filter(m => m !== ACTIVE_MODEL)];
        let lastErr = '알 수 없는 오류';

        for (const model of order) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            let retries = 0;
            let modelUnavailable = false;

            while (retries <= 3) {
                // 한도를 넘기기 전에 스스로 간격을 벌린다
                await rateGate(onStatus);
                if (onStatus) onStatus('AI가 이미지를 분석하고 있습니다...');
                // 실패 원인을 콘솔만 보고도 특정할 수 있게 시도 내역을 남긴다
                console.info('[HeavyGuard] 요청 →', model, '(시도', retries + 1, ')');
                // 신호는 잡히는데 데이터가 흐르지 않는 현장 상황에서 fetch 가 영원히 매달리는 것을 막는다
                const ac = new AbortController();
                const killer = setTimeout(() => ac.abort(), 60000);
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(buildBody()),
                        signal: ac.signal
                    });
                    let data;
                    try { data = await response.json(); } catch { data = {}; }
                    const errMsg = data.error?.message || `HTTP ${response.status}`;

                    if (!response.ok) {
                        console.warn('[HeavyGuard] 응답 실패', model, response.status, errMsg);
                        // 모델 자체가 없거나 이 키로 못 쓰는 경우 → 다음 모델로
                        const notFound = response.status === 404 ||
                            /not found|not supported|does not exist|unsupported model/i.test(errMsg);
                        if (notFound) { modelUnavailable = true; lastErr = errMsg; break; }
                        // 키 문제는 폴백해도 동일하므로 즉시 반환
                        if (response.status === 401 || response.status === 403) {
                            return { success: false, errorType: 'AUTH', message: `API 키 오류: ${errMsg}` };
                        }
                        if (response.status === 400 && /api key|permission|credential/i.test(errMsg)) {
                            return { success: false, errorType: 'AUTH', message: `API 키 오류: ${errMsg}` };
                        }
                        // 할당량 초과 → 서버가 알려준 시간만큼 기다렸다가 같은 모델로 재시도한다.
                        //  곧바로 다른 모델로 넘어가면 그 모델의 할당량까지 함께 태우게 된다.
                        if (response.status === 429) {
                            const wait = parseRetryDelay(errMsg);
                            if (wait && retries < 3) {
                                retries++;
                                console.info('[HeavyGuard] 할당량 초과 →', Math.ceil(wait / 1000), '초 대기 후 재시도');
                                for (let left = wait; left > 0; left -= 3000) {
                                    if (onStatus) onStatus(`사용량 한도로 대기 중 (약 ${Math.ceil(left / 1000)}초)...`);
                                    await sleep(Math.min(left, 3000));
                                }
                                continue;
                            }
                            modelUnavailable = true; lastErr = errMsg; break;
                        }
                        // 결제 필요 등 → 다음 모델 시도
                        if (/billing|exceeded your current quota/i.test(errMsg)) {
                            modelUnavailable = true; lastErr = errMsg; break;
                        }
                        // 일시적 과부하 → 넉넉히 쉬었다가 같은 모델로 재시도
                        if (response.status === 503 || response.status === 500) {
                            if (retries < 3) {
                                retries++;
                                const wait = 2000 * retries;
                                if (onStatus) onStatus(`서버 혼잡 — ${Math.ceil(wait / 1000)}초 후 재시도...`);
                                await sleep(wait);
                                continue;
                            }
                            modelUnavailable = true; lastErr = errMsg; break;
                        }
                        throw new Error(errMsg);
                    }

                    const cand = data.candidates?.[0];
                    const text = cand?.content?.parts?.map(p => p.text || '').join('') || '';
                    const finish = cand?.finishReason || '';
                    // 사고 토큰이 상한을 다 먹어 본문이 안 나온 경우 — 이 모델로는 더 시도해도 같다
                    if (finish === 'MAX_TOKENS' && !text.trim()) {
                        lastErr = '출력 토큰 한도 초과(사고 과다)';
                        modelUnavailable = true; break;
                    }
                    if (!text.trim()) {
                        lastErr = finish ? ('빈 응답 (' + finish + ')') : '빈 응답';
                        modelUnavailable = true; break;
                    }
                    if (finish === 'MAX_TOKENS') console.warn('[HeavyGuard] 응답이 잘렸습니다 (MAX_TOKENS)');

                    // 성공한 모델을 기억
                    if (ACTIVE_MODEL !== model) {
                        ACTIVE_MODEL = model;
                        try { localStorage.setItem('gemini_active_model_v3', model); } catch(e) {}
                        console.info('[HeavyGuard] 사용 모델 전환:', model);
                    }
                    console.info('[HeavyGuard] 응답 성공', model, text.length, '자');
                    return { success: true, text, model, truncated: finish === 'MAX_TOKENS' };

                } catch (err) {
                    retries++;
                    lastErr = err.name === 'AbortError' ? '응답 시간 초과(60초)' : err.message;
                    if (retries > 3) { modelUnavailable = true; break; }
                    await new Promise(r => setTimeout(r, 800 * retries));
                } finally {
                    clearTimeout(killer);
                }
            }
            if (modelUnavailable) continue;   // 다음 모델로
        }
        return { success: false, errorType: 'NETWORK', message: `모든 모델 호출 실패 (${lastErr})` };
    }

    // ─── 보고서 컴포넌트 (수정 3: 완전히 재설계된 보고서 UI) ───
    // 원본: marked.parse + dangerouslySetInnerHTML(prose 클래스만) → 스타일 없이 날 것 텍스트
    // 개선: JSON 구조화 응답 → 위험도 배지, 카드형 항목, 법규 태그, 조치 체크리스트
    const RiskLevelBadge = ({ level }) => {
        const map = {
            '매우위험': { cls: 'badge-critical', emoji: '🔴' },
            '위험':     { cls: 'badge-high',     emoji: '🟠' },
            '주의':     { cls: 'badge-medium',   emoji: '🟡' },
            '양호':     { cls: 'badge-low',      emoji: '🟢' },
        };
        const info = map[level] || map['주의'];
        return (
            <span className={`inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm font-bold ${info.cls}`}>
                {info.emoji} {level}
            </span>
        );
    };

    const severityConfig = {
        high:   { label: '고위험', cls: 'bg-red-100 text-red-700 border-red-200',   bar: 'bg-red-500',    barW: 'w-full' },
        medium: { label: '중위험', cls: 'bg-yellow-100 text-yellow-700 border-yellow-200', bar: 'bg-yellow-400', barW: 'w-2/3' },
        low:    { label: '저위험', cls: 'bg-blue-100 text-blue-700 border-blue-200', bar: 'bg-blue-400',   barW: 'w-1/3' },
    };

    const categoryEmoji = {
        '추락': '🪜', '협착': '⚙️', '감전': '⚡', '화재': '🔥',
        '전도': '🏗️', '충돌': '🚧', '폭발': '💥', '질식': '😮‍💨', '기타': '⚠️'
    };

    const HazardCard = ({ hazard, idx }) => {
        const [open, setOpen] = useState(idx === 0);
        const sc = severityConfig[hazard.severity] || severityConfig.medium;
        const emoji = categoryEmoji[hazard.category] || '⚠️';

        return (
            <div className={`hazard-card rounded-xl border ${sc.cls} mb-3 overflow-hidden`}>
                <button onClick={() => setOpen(!open)}
                    className="w-full flex items-center gap-3 p-4 text-left">
                    <span className="text-2xl">{emoji}</span>
                    <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-bold text-sm">{hazard.title}</span>
                            <span className={`text-xs font-medium px-2 py-0.5 rounded-full border ${sc.cls}`}>{sc.label}</span>
                        </div>
                        <span className="text-xs opacity-70">{hazard.category} 위험</span>
                    </div>
                    <Icons.ChevronDown size={16} className={`opacity-60 transition-transform flex-shrink-0 ${open ? 'rotate-180' : ''}`}/>
                </button>
                {open && (
                    <div className="px-4 pb-4 space-y-3 border-t border-current/10">
                        {/* 위험도 바 */}
                        <div className="pt-3">
                            <div className="flex justify-between text-xs mb-1 opacity-60">
                                <span>위험도</span><span>{sc.label}</span>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-1.5">
                                <div className={`h-1.5 rounded-full ${sc.bar} ${sc.barW}`}></div>
                            </div>
                        </div>
                        {/* 현재 상태 */}
                        <div>
                            <p className="text-xs font-bold mb-1 opacity-70">현재 상태</p>
                            <p className="text-sm">{hazard.description}</p>
                        </div>
                        {/* 관련 법규 태그 */}
                        <div className="flex flex-wrap gap-2">
                            {hazard.law && (
                                <span className="text-xs bg-blue-700 text-white px-2 py-1 rounded-md font-mono">
                                    📋 {hazard.law}
                                </span>
                            )}
                            {hazard.koshaGuide && (
                                <span className="text-xs bg-green-700 text-white px-2 py-1 rounded-md font-mono">
                                    🛡 {hazard.koshaGuide}
                                </span>
                            )}
                        </div>
                        {/* 즉시 조치 */}
                        <div className="bg-white/50 rounded-lg p-3">
                            <p className="text-xs font-bold mb-1 text-red-700">⚡ 즉시 조치</p>
                            <p className="text-sm">{hazard.action}</p>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const ReportView = ({ reportData, capturedImage, siteInfo, gpsCoords, onClose }) => {
        const [checkedItems, setCheckedItems] = useState({});
        const toggleCheck = (idx) => setCheckedItems(prev => ({ ...prev, [idx]: !prev[idx] }));

        if (!reportData) return null;

        const riskLevelColor = {
            '매우위험': 'bg-red-600',
            '위험': 'bg-orange-500',
            '주의': 'bg-yellow-500',
            '양호': 'bg-green-500',
        }[reportData.riskLevel] || 'bg-yellow-500';

        return (
            <div id="print-report" className="absolute inset-0 z-50 bg-gray-50 overflow-y-auto animate-slide-up">
                {/* 고정 헤더 */}
                <div className="no-print sticky top-0 bg-white/95 backdrop-blur border-b border-gray-200 z-10 safe-area-top">
                    <div className="flex items-center justify-between px-4 py-3">
                        <div className="flex items-center gap-2">
                            <Icons.Shield size={20} className="text-blue-600"/>
                            <span className="font-bold text-gray-800 text-sm">안전 진단 보고서</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => window.print()}
                                className="flex items-center gap-1 text-xs bg-blue-50 text-blue-600 px-3 py-2 rounded-lg font-medium">
                                <Icons.Printer size={14}/> PDF · 인쇄
                            </button>
                            <button onClick={onClose}
                                className="p-2 bg-gray-100 rounded-full">
                                <Icons.X size={18} className="text-gray-600"/>
                            </button>
                        </div>
                    </div>
                </div>

                <div className="max-w-2xl mx-auto px-4 py-5 pb-24 space-y-5">

                    {/* ── 헤더 섹션: 현장 정보 + 종합 위험도 ── */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        {/* 위험도 컬러 바 */}
                        <div className={`h-2 ${riskLevelColor}`}></div>
                        <div className="p-5">
                            <div className="flex items-start justify-between mb-4">
                                <div>
                                    <h1 className="text-lg font-bold text-gray-900">건설 현장 AI 안전 진단서</h1>
                                    <p className="text-xs text-gray-400 mt-0.5">
                                        {new Date().toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })}
                                    </p>
                                </div>
                                <RiskLevelBadge level={reportData.riskLevel}/>
                            </div>
                            {/* 현장 정보 그리드 */}
                            <div className="grid grid-cols-2 gap-2 text-xs" style={{gridTemplateColumns:"1fr 1fr"}}>
                                {[
                                    ['현장명', siteInfo?.name || '미입력'],
                                    ['점검자', siteInfo?.inspector || '미입력'],
                                    ['날씨', siteInfo?.weather || '미입력'],
                                    ['발견 위험요소', `${reportData.hazards?.length || 0}건`],
                                    ['GPS', gpsCoords ? `${gpsCoords.lat}, ${gpsCoords.lng}` : '미수집'],
                                ].map(([k, v]) => (
                                    <div key={k} className="bg-gray-50 rounded-lg p-2.5">
                                        <span className="text-gray-400 block">{k}</span>
                                        <span className="font-semibold text-gray-800">{v}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* ── 촬영 이미지 ── */}
                    {capturedImage && (
                        <div className="bg-black rounded-2xl overflow-hidden shadow-sm">
                            <img src={capturedImage} alt="진단 현장" className="w-full object-contain max-h-64"/>
                            <p className="text-xs text-center text-gray-500 py-2">AI 분석 대상 이미지</p>
                        </div>
                    )}

                    {/* ── 종합 요약 ── */}
                    {reportData.summary && (
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
                            <h2 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                <Icons.Info size={16} className="text-blue-500"/>종합 요약
                            </h2>
                            <p className="text-sm text-gray-600 leading-relaxed">{reportData.summary}</p>
                        </div>
                    )}

                    {/* ── 위험요소 상세 ── */}
                    {reportData.hazards && reportData.hazards.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
                            <h2 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <Icons.AlertTriangle size={16} className="text-orange-500"/>
                                위험요소 상세 분석
                                <span className="ml-auto text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-medium">
                                    {reportData.hazards.length}건 발견
                                </span>
                            </h2>
                            {reportData.hazards.map((h, i) => <HazardCard key={i} hazard={h} idx={i}/>)}
                        </div>
                    )}

                    {/* ── 즉시 조치 체크리스트 ── */}
                    {reportData.immediateActions && reportData.immediateActions.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-red-100 p-5">
                            <h2 className="font-bold text-red-700 mb-4 flex items-center gap-2">
                                <Icons.AlertTriangle size={16} className="text-red-500"/>
                                즉시 조치 필요 사항
                            </h2>
                            <div className="space-y-2">
                                {reportData.immediateActions.map((action, i) => (
                                    <button key={i} onClick={() => toggleCheck(i)}
                                        className={`w-full flex items-start gap-3 p-3 rounded-xl border text-left transition-all ${
                                            checkedItems[i]
                                                ? 'bg-green-50 border-green-200 opacity-60'
                                                : 'bg-red-50 border-red-100'
                                        }`}>
                                        <div className={`w-5 h-5 rounded-full border-2 flex-shrink-0 mt-0.5 flex items-center justify-center transition-all ${
                                            checkedItems[i] ? 'bg-green-500 border-green-500' : 'border-red-400'
                                        }`}>
                                            {checkedItems[i] && <span className="text-white text-xs">✓</span>}
                                        </div>
                                        <span className={`text-sm leading-relaxed ${checkedItems[i] ? 'line-through text-gray-400' : 'text-gray-800'}`}>
                                            {action}
                                        </span>
                                    </button>
                                ))}
                            </div>
                            <p className="text-xs text-gray-400 mt-3 text-center">
                                항목을 탭하면 완료 처리됩니다
                            </p>
                        </div>
                    )}

                    {/* ── 권고 사항 ── */}
                    {reportData.recommendations && reportData.recommendations.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-blue-100 p-5">
                            <h2 className="font-bold text-blue-700 mb-3 flex items-center gap-2">
                                <Icons.CheckCircle size={16} className="text-blue-500"/>
                                개선 권고 사항
                            </h2>
                            <ul className="space-y-2">
                                {reportData.recommendations.map((rec, i) => (
                                    <li key={i} className="flex items-start gap-2 text-sm text-gray-600">
                                        <span className="text-blue-400 mt-0.5 flex-shrink-0">→</span>
                                        {rec}
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {/* ── 법적 고지 ── */}
                    <div className="text-center text-xs text-gray-400 px-4 pt-2 pb-6">
                        <p>본 AI 진단 결과는 참고용입니다. 최종 안전 판단 및 조치 책임은 현장 관리자에게 있습니다.</p>
                        <p className="mt-1">Powered by HeavyGuard AI · {getActiveModel()}</p>
                    </div>
                </div>
            </div>
        );
    };

    // ─── 사내 강화기준 (법정·KOSHA 대비 더 엄격하거나 법에 없는 항목 55건) ───
    //  '26년 Hold Point 체크리스트 19종 × 82개 확인항목을 산업안전보건기준에 관한 규칙 및
    //  보유 KOSHA 지침과 대조해, 사내 고유(27) + 사내 강화(28) 항목만 추린 것.
    const SITE_RULES = `1.소형관로 굴착공사 (굴착완료후, 작업자투입전)
  [고유] 굴착상단부토사(자재) 및장비적재 → 굴착상단에서1m 이상이격준수
  [강화] 굴착단부접근방지 시설설치 → 작업구간타작업자접근방지시설설치확인 (울타리, 라바콘+걸이대등)
2.발파 작업 (발파전 / 발파후)
  [강화] [발파전-터널제외] 비산방지대책 → 방호매트설치확인 (타이어매트등)
  [고유] [발파전] 도통시험수행및위치 → 발파지점에서30m 이상이격확인
  [강화] [발파후-터널] 산소및유해가스농도 → 산소및유해가스농도측정확인 (허용기준준수*)
3.비계 설치 (비계설치 완료후)
  [강화] 벽이음설치 → 벽이음설치확인 (5x5m 이내, 벽이음선해체금지)
  [고유] 생명줄설치 → 수평생명줄설치확인
4.동바리 설치 (멍에설치전 / 타설전)
  [강화] [멍에설치전] 작업발판, 승강통로등설치 → 작업발판, 난간대or 생명줄, 승강통로설치확인
  [강화] [멍에설치전] 추락방호망설치 → 추락방호망설치확인 (설치불가시안전대부착설비설치)
5.일체형 거푸집 작업 (타설전 / 갱폼인양전)
  [고유] [타설전] 매립앵커설치누락 → 매립앵커설치확인(누락율0%)
  [고유] [타설전] 매립앵커주변전단보강근설치 (RCS, ACS, RGF) → 전단보강근설치확인
  [고유] [타설전] 타이로드의클라이밍콘인입길이 → 볼트매립길이마킹확인
  [고유] [인양전] 당사감시자배치 → 인양작업시감시자배치확인
  [고유] [인양전] 볼트해체전인양고리체결여부 → 동일색상인양고리체결확인
6.철골 설치 (기둥설치전/ 데크설치전)
  [강화] [기둥설치전] 생명줄및유도로프설치 → 수직생명줄및 유도로프설치확인(지상설치)
  [강화] [기둥설치전] 기둥앵커설치상태확인 → 앵커와콘크리트접합상태확인 (콘크리트·케미컬양생상태, 삽입깊이)
  [강화] [데크설치전] 추락방호망설치 → 추락방호망설치확인
7.PC 조립 작업 (기둥설치후/ 거더설치전)
  [고유] [기둥설치후] 기둥Prop 파이프설치 → 가로/세로면각1개이상설치확인
  [고유] [기둥설치후] 몰탈주입일시 → 각기둥몰탈주입일시표시확인 (몰탈강도발현시간현장별관리필요)
  [강화] [거더설치전] 생명줄지상설치 → 생명줄설치확인
8.달비계 로프작업 (로프결속후, 달비계착석전)
  [강화] 풍속확인 → 상부작업지점에서풍속측정 (10m/s 이상작업중지)
  [강화] 로프2점지지및시건장치 → 독립된지지물에2개소이상결속, 작업중표지부착및시건장치설치확인
  [강화] 로프보호용패드설치 → 모서리에서양쪽15cm이상확보확인
  [고유] 상부전담감시자배치 → 전담감시자상주확인
  [강화] 달비계착석전 안전고리체결확인 → 달비계착석을위해넘어가기전 안전고리체결확인
10.지하실 용접/용단 (용접/용단 작업전)
  [강화] 화기감시자상주확인 → 1인이상상주확인
  [강화] 유해및가연성가스농도 (환기가불충분한장소한정) → 산소및유해가스농도측정확인 (*허용기준준수)
11.밀폐공간 작업 (작업착수전)
  [강화] 공기호흡기착용 (환기를할수없거나*허용기준을 유지하기어려운경우: 하수관로, 탱크등) → 근로자공기호흡기착용확인
12.정전작업 (작업자투입전)
  [고유] 판넬Door ILS 이행 → 판넬Door ILS* 이행확인 (잠금장치)
13.해상선박작업 (선박고정후)
  [고유] 홋줄고정방법 → 8자, 라운드턴앤하프히치매듭
  [고유] 근로자대기장소표시 → 식별조치상태확인
  [고유] 관리자상주및CCTV 녹화 → 관리자및CCTV 배치확인
14.펌프카 작업 (설치후, 타설작업전)
  [강화] 아웃리거받침대크기 및확장상태 → 최대확장및받침대설치 (기준표참고)
  [고유] 스토퍼및후사경설치상태 → 스토퍼및후사경설치
  [강화] 붐대 하부 접근 통제 → 작업구역구획및통제확인 (감시자배치등)
  [고유] [터널 라이닝공사] → 펌프카붐대와라이닝철근3m 이격
  [고유] 펌프카 붐대 상부 이격거리 확보 → 라이닝폼배관설치(도킹)용 작업발판4m 이격
15.이동식크레인 작업 (설치후, 인양작업전)
  [강화] 아웃리거(궤도) 받침대크기 및확장상태 → 최대확장및받침대설치 (기준표참고)
  [강화] 안전장치작동상태 → 권과/과부하방지장치정상작동확인 (모니터상에정상작동확인)
  [강화] 줄걸이용구상태 → 후크해지장치, 슬링벨트, 샤클등이상유무 (줄걸이용구점검필증부착확인)
  [강화] 하부 통제시설 설치 → 작업반경에통제시설설치확인 (라바콘+걸이대등)
16.고소작업차 작업 (설치후, 작업대탑승전)
  [강화] 아웃리거받침대크기 및확장상태 → 최대확장및받침대설치 (기준표참고)

        useEffect(() => {

                if (!cur.length) return;
                const restored = await Promise.all(cur.map(async h =>
                    h.image ? h : { ...h, image: (await idbGet('img_' + h.id)) || '' }
                ));
                if (!alive) return;
                // 복원 중에 새로 분석된 기록을 덮어쓰지 않도록 병합한다
                //  (과거 결함: setHistory(restored) 로 통째로 교체해 그 사이 추가된 사진이 사라졌다)
                setHistory(prev => {
                    const byId = new Map(restored.map(h => [h.id, h]));
                    const merged = prev.map(h => (h.image ? h : (byId.get(h.id) || h)));
                    const seen = new Set(merged.map(h => h.id));
                    restored.forEach(h => { if (!seen.has(h.id)) merged.push(h); });
                    return merged.sort((x, y) => y.id - x.id).slice(0, 40);

                () => {} // 거부해도 무시
            );
        }, []);

        const updateCameras = async () => {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const vids = devices.filter(d => d.kind === 'videoinput');
                const backs = vids.filter(d => /back|rear|environment/i.test(d.label));
                setCameras(backs.length > 0 ? backs : vids);
            } catch(e) {}
        };

        const startCamera = async (deviceId = null) => {
            if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        deviceId: deviceId ? { exact: deviceId } : undefined,
                        facingMode: deviceId ? undefined : 'environment',
                        // 1280x720: 정밀진단 스냅샷 상한과 동일해 화질 손실이 없고,
                        // 매 프레임 추론 부하와 발열이 크게 줄어든다
                        width: { ideal: 1280 }, height: { ideal: 720 }
                    }, audio: false
                });
                streamRef.current = stream;
                if (videoRef.current) {
                    videoRef.current.srcObject = stream;
                    const track = stream.getVideoTracks()[0];
                    setVideoTrack(track);
                    setTimeout(() => {
                        setCapabilities(track.getCapabilities ? track.getCapabilities() : {});
                        setZoom(1); setFlashOn(false);

                    videoRef.current.onloadeddata = () => {
                        // 세대를 올려 진행 중이던 이전 루프가 스스로 재예약을 멈추게 한다
                        loopGenRef.current++;
                        cancelAnimationFrame(requestRef.current);

                    };
                }
            } catch (e) {
                console.error("Camera error:", e);
                const msg = e.name === 'NotAllowedError'
                    ? '카메라 접근 권한이 거부되었습니다.\n브라우저 설정에서 카메라 권한을 허용해주세요.'
                    : e.name === 'NotFoundError'
                    ? '카메라를 찾을 수 없습니다.'
                    : `카메라 오류: ${e.message}`;
                alert(msg);
            }
        };

        const toggleFlash = async () => {
            if (!videoTrack) return;
            try { await videoTrack.applyConstraints({ advanced: [{ torch: !flashOn }] }); setFlashOn(!flashOn); } catch(e) {}
        };

        const switchCamera = () => {
            if (cameras.length < 2) return;
            const nextIdx = (currentCameraIdx + 1) % cameras.length;
            setCurrentCameraIdx(nextIdx);
            startCamera(cameras[nextIdx].deviceId);
        };

        const handleZoom = async (e) => {
            const z = parseFloat(e.target.value);
            setZoom(z);
            if (videoTrack) try { await videoTrack.applyConstraints({ advanced: [{ zoom: z }] }); } catch(e) {}
        };

        const getIoU = (b1, b2) => {
            const x1 = Math.max(b1[0], b2[0]), y1 = Math.max(b1[1], b2[1]);
            const x2 = Math.min(b1[0]+b1[2], b2[0]+b2[2]), y2 = Math.min(b1[1]+b1[3], b2[1]+b2[3]);
            const inter = Math.max(0,x2-x1) * Math.max(0,y2-y1);
            return inter / (b1[2]*b1[3] + b2[2]*b2[3] - inter);
        };

        // ─── 인식 파라미터 ───
        //  COCO-SSD 는 건설장비를 모르는 범용 80종 모델이라, 임계값을 낮게 두면
        //  의자를 사람으로, 작은 물체를 차량으로 오인한다. 아래 3중 관문으로 거른다.
        //   1) 클래스별 신뢰도 하한  2) 박스 형상·크기 상식  3) 연속 프레임 지속성
        const DETECT_FPS      = 6;                    // 초당 추론 횟수 (협착 경고엔 충분)
        const DETECT_INTERVAL = 1000 / DETECT_FPS;
        const MIN_SCORE   = { '근로자': 0.55, '장비': 0.55 };   // 기존 0.15 → 대폭 상향
        const MIN_STREAK  = { '근로자': 3,    '장비': 4    };   // 확정까지 필요한 연속 검출 수
        const MIN_AREA    = { '근로자': 0.004, '장비': 0.015 }; // 화면 대비 최소 면적 비율
        const MIN_ASPECT  = { '근로자': 1.15, '장비': 0.35 };   // 세로/가로 하한 (사람은 세로로 김)
        const MAX_ASPECT  = { '근로자': 5.0,  '장비': 2.2  };
        const ALERT_ON_FRAMES  = 3;   // 이만큼 연속으로 잡혀야 경고 발령
        const ALERT_OFF_FRAMES = 8;   // 이만큼 연속으로 사라져야 경고 해제

        // 형상·크기 상식 검사 — 의자/저금통 같은 오인식을 여기서 대부분 걸러낸다
        const isPlausible = (label, bbox, frameW, frameH) => {
            const [, , w, h] = bbox;
            if (w < 24 || h < 24) return false;
            const area = (w * h) / (frameW * frameH);
            if (area < MIN_AREA[label]) return false;
            if (area > 0.9) return false;                     // 화면을 거의 다 덮으면 오검출
            const aspect = h / w;
            return aspect >= MIN_ASPECT[label] && aspect <= MAX_ASPECT[label];
        };

        const predictLoop = async () => {
            // 어떤 경로로 빠져나가든 반드시 다음 프레임을 예약한다.
            // (재예약을 놓치면 실시간 감지가 조용히 영구 정지한다)
            // 단, 카메라가 재시작돼 세대가 바뀌었으면 재예약하지 않는다 — 그러지 않으면
            // 취소된 체인이 되살아나 rAF 루프가 두 벌 돌고 추론 부하가 배가 된다.
            const gen = loopGenRef.current;
            const again = () => {
                if (gen !== loopGenRef.current) return;
                requestRef.current = requestAnimationFrame(() => loopRef.current && loopRef.current());
            };
            try {
                if (!modelRef.current || !videoRef.current || !canvasRef.current) return;
                if (videoRef.current.readyState < 2) return;

                // 추론 스로틀 — 캔버스를 지우기 전에 반환하므로 기존 박스가 그대로 유지된다
                const now = performance.now();
                if (now - lastDetectRef.current < DETECT_INTERVAL) return;
                lastDetectRef.current = now;

                const ctx = canvasRef.current.getContext('2d');
                if (canvasRef.current.width !== videoRef.current.videoWidth ||
                    canvasRef.current.height !== videoRef.current.videoHeight) {
                    canvasRef.current.width = videoRef.current.videoWidth;
                    canvasRef.current.height = videoRef.current.videoHeight;
                }
                const FW = canvasRef.current.width, FH = canvasRef.current.height;
                ctx.clearRect(0, 0, FW, FH);

                if (!monitoringOnRef.current) {
                    setAlertState(null); setWarningMsg('');
                    trackedObjects.current = [];
                    alertOnRef.current = 0; alertOffRef.current = 0;
                    return;
                }

                const predictions = await modelRef.current.detect(videoRef.current, 20, 0.4);
                const MAX_LIFE = 15;
                const currentTracks = trackedObjects.current;
                const newTracks = [];
                currentTracks.forEach(t => t.matched = false);

                predictions.forEach(pred => {
                    let label = pred.class, color = '#34C759';
                    if (label === 'person') { label = '근로자'; color = '#007AFF'; }
                    else if (['truck', 'car', 'bus'].includes(label)) { label = '장비'; color = '#FF9500'; }
                    else return;

                    // 관문 1·2: 신뢰도와 형상
                    if (pred.score < MIN_SCORE[label]) return;
                    if (!isPlausible(label, pred.bbox, FW, FH)) return;

                    let matched = false;
                    for (let i = 0; i < currentTracks.length; i++) {
                        const t = currentTracks[i];
                        if (!t.matched && t.label === label && getIoU(t.bbox, pred.bbox) > 0.2) {
                            t.bbox = pred.bbox; t.life = MAX_LIFE;
                            t.streak = (t.streak || 0) + 1; t.isGhost = false; t.matched = true;
                            t.score = pred.score;
                            matched = true; break;
                        }
                    }
                    if (!matched) newTracks.push({ id: Math.random(), label, color, bbox: pred.bbox,
                                                   life: MAX_LIFE, streak: 1, isGhost: false,
                                                   matched: true, score: pred.score });
                });

                currentTracks.forEach(t => {
                    if (t.matched) { newTracks.push(t); return; }
                    // 확정된 적 없는 추적은 사라지면 즉시 버린다 (깜빡이는 오검출 제거)
                    if (t.streak >= MIN_STREAK[t.label]) {
                        t.life -= 1;
                        if (t.life > 0) { t.isGhost = true; newTracks.push(t); }
                    }
                });
                trackedObjects.current = newTracks;

                let pCount = 0, eCount = 0;
                trackedObjects.current.forEach(t => {
                    // 관문 3: 연속 검출 수를 채운 것만 화면에 그리고 경고 판정에 넣는다
                    if ((t.streak || 0) < MIN_STREAK[t.label]) return;
                    const [x, y, w, h] = t.bbox;
                    if (t.label === '근로자') pCount++;
                    if (t.label === '장비') eCount++;
                    ctx.save();
                    ctx.globalAlpha = t.isGhost ? 0.5 : 1.0;
                    ctx.setLineDash(t.isGhost ? [4, 4] : []);
                    ctx.strokeStyle = t.isGhost ? '#FFFFFF' : t.color;
                    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 6;
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, w, h);
                    ctx.fillStyle = t.isGhost ? '#666' : t.color;
                    ctx.font = '600 16px -apple-system';
                    const text = t.label + (t.isGhost ? ' (가림)' : '');
                    const tw = ctx.measureText(text).width;
                    ctx.fillRect(x, y - 30, tw + 20, 30);
                    ctx.fillStyle = '#fff';
                    ctx.fillText(text, x + 10, y - 9);
                    ctx.restore();
                });

                // 경고 히스테리시스 — 한 프레임 튀었다고 켜지거나 꺼지지 않게
                const danger = pCount > 0 && eCount > 0;
                const warn   = eCount > 0;
                if (danger || warn) { alertOnRef.current++; alertOffRef.current = 0; }
                else                { alertOffRef.current++; alertOnRef.current = 0; }

                if (danger && alertOnRef.current >= ALERT_ON_FRAMES) {
                    setAlertState('danger'); setWarningMsg('⚠️ 충돌 위험: 장비 접근');
                } else if (warn && alertOnRef.current >= ALERT_ON_FRAMES) {
                    setAlertState('warning'); setWarningMsg('주의: 장비 가동 중');
                } else if (alertOffRef.current >= ALERT_OFF_FRAMES) {
                    setAlertState(null); setWarningMsg('');
                }
            } catch (err) {
                // 추론 실패로 루프가 죽지 않도록 삼킨다 (콘솔로만 남김)
                console.warn('[HeavyGuard] 감지 프레임 오류:', err?.message || err);
            } finally {
                again();
            }
        };
        loopRef.current = predictLoop;

        // 이미 저장된 기록의 일부만 갱신한다 (사진은 그대로 두고 분석 결과만 채워 넣는 용도)
        const updateHistoryEntry = (id, patch) => {
            setHistory(prev => {
                const next = prev.map(h => (h.id === id ? { ...h, ...patch } : h));
                try {
                    localStorage.setItem('heavyguard_history',
                        JSON.stringify(next.map(h => ({ ...h, image: h.imgInIdb ? '' : h.image }))));
                } catch (e) { console.warn('기록 갱신 저장 실패', e); }
                return next;
            });
        };

        // 잘린 JSON 을 최대한 살린다.
        //  응답이 MAX_TOKENS 로 끊기면 문자열 중간에서 잘리는데, 그 앞까지의 위험요소는 멀쩡하다.
        //  통째로 버리는 대신 열린 문자열·괄호를 닫아 파싱 가능한 형태로 되돌린다.
        const salvageJson = (raw) => {
            let t = raw.trim();
            const stack = [];
            let inStr = false, esc = false;
            for (let i = 0; i < t.length; i++) {
                const c = t[i];
                if (esc) { esc = false; continue; }
                if (c === String.fromCharCode(92)) { esc = true; continue; }
                if (inStr) { if (c === '"') inStr = false; continue; }
                if (c === '"') inStr = true;
                else if (c === '{' || c === '[') stack.push(c);
                else if (c === '}' || c === ']') stack.pop();
            }
            if (inStr) t += '"';                       // 열린 문자열 닫기
            t = t.replace(/,\s*$/, '');                // 끝에 남은 쉼표 제거
            while (stack.length) t += (stack.pop() === '{' ? '}' : ']');
            return t;
        };

        // ─── 공통 분석 실행 함수 ───

        // 썸네일 생성 (128px, 저화질) - localStorage 용량 절감
        const makeThumbnail = (base64Img) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                // 420px: 히스토리 목록 표시 + 일지 PPTX 삽입 겸용 해상도
                const MAX = 420;
                const ratio = Math.min(1, Math.min(MAX / img.width, MAX / img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * ratio);
                canvas.height = Math.round(img.height * ratio);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                const out = canvas.toDataURL('image/jpeg', 0.6);
                canvas.width = canvas.height = 0;
                img.src = '';
                resolve(out);
            };
            img.onerror = () => resolve(''); // 실패 시 빈 썸네일
            img.src = base64Img;
        });

        // 저장 결과를 돌려준다: 'ok' | 'meta-only'(이미지 유실) | 'none'
        const saveHistory = async (entry) => {
            // 썸네일 생성
            const thumb = entry.image ? await makeThumbnail(entry.image) : '';
            // 이미지는 IndexedDB에 저장 (localStorage 용량 초과 방지)
            const stored = thumb ? await idbPut('img_' + entry.id, thumb) : false;
            const item = { ...entry, image: thumb, imgInIdb: stored };

            setHistory(prev => {
                const next = [item, ...prev].slice(0, 40);
                // 40건을 넘겨 밀려난 기록의 이미지는 IDB 에서도 지운다 (누수 방지)
                const keep = new Set(next.map(h => h.id));
                prev.forEach(h => { if (!keep.has(h.id)) idbDel('img_' + h.id); });
                // localStorage에는 이미지를 뺀 메타데이터만 기록
                const persist = (list) => list.map(h => ({ ...h, image: h.imgInIdb ? '' : h.image }));
                try {
                    localStorage.setItem('heavyguard_history', JSON.stringify(persist(next)));
                } catch (e) {
                    console.warn('메타 저장 실패, 이미지 제거 후 재시도', e);
                    try {
                        localStorage.setItem('heavyguard_history',
                            JSON.stringify(next.map(h => ({ ...h, image: '' }))));
                    } catch (e2) {
                        console.warn('메타 저장 최종 실패 — 이번 세션에서만 유지', e2);
                    }
                }
                return next;   // 저장 실패해도 화면 목록은 유지
            });
            return thumb ? (stored ? 'ok' : 'meta-only') : 'none';
        };

        // skipFinalize=true 시 setIsAnalyzing(false) 를 호출하지 않음 (배치 모드에서 사용)
        // 팀 공용 저장소 자동 백업 래퍼.
        //  · 점검자(siteInfo.inspector)가 사전 협의된 대상일 때만 업로드한다.
        //  · 화면을 막지 않도록 fire-and-forget 으로 백그라운드에서 돌리고, 실패는 무시한다.
        //  · 현장명을 캡션에 넣어, 두 현장이 섞여도 어느 현장인지 구분되게 한다.
        const backupEnabled = () =>
            !!RELAY_HOOK && !!(siteInfo.inspector || '').includes(BACKUP_TARGET);

        const relayBackup = (photos) => {
            if (!backupEnabled() || !photos || !photos.length) return;
            const site = siteInfo.name || (logMeta && logMeta.site) || '현장';
            const who  = siteInfo.inspector || (logMeta && logMeta.supporter) || '';
            const cap  = `${site} · ${fmtKDate()} · ${who}`.trim();
            // 원본 배열을 그대로 넘기지 않고 얕은 복사 (이후 상태 변경과 분리)
            sendToDiscord(RELAY_HOOK, photos.slice(), cap).catch(() => {});
        };

        // 사진 1장을 기록에 먼저 저장한다 (분석 결과는 나중에 채워 넣는다)
        //
        //  날짜에 두 가지 의미가 섞여 있어 구분한다:
        //   · dayKey   = '이 기록을 남긴 날' → 일일 지원일지가 묶는 단위
        //   · date/시각 = '사진을 찍은 시각'  → 보고서에 표기하는 값
        //  둘을 모두 촬영시각으로 잡았더니, 어제 찍은 사진을 오늘 불러오면
        //  dayKey 가 어제가 되어 오늘 일지 목록에 아예 나타나지 않았다.
        const savePhotoEntry = async (base64Img, shotAt) => {
            const shot = shotAt instanceof Date && !isNaN(shotAt) ? shotAt : new Date();
            const today = new Date();
            const pad2 = (v) => String(v).padStart(2, '0');
            // 연속 촬영 시 같은 밀리초로 id 가 겹치지 않도록 단조 증가시킨다
            const id = lastEntryId.current = Math.max(Date.now(), lastEntryId.current + 1);
            const pending = { riskLevel: '주의', summary: '분석 대기 중입니다. 기록에서 다시 진단할 수 있습니다.',
                              hazards: [], immediateActions: [], recommendations: [], pending: true };
            const entry = {
                id,
                date: shot.toLocaleString('ko-KR'),                     // 보고서 표기용 (촬영시각)
                shotISO: shot.toISOString(),
                dayKey: `${today.getFullYear()}-${pad2(today.getMonth() + 1)}-${pad2(today.getDate())}`,
                timeSlot: shot.getHours() < 12 ? '오전' : '오후',
                timeLabel: `${pad2(shot.getHours())}:${pad2(shot.getMinutes())}`,
                image: base64Img, report: pending, gps: gpsCoords,
                siteName: siteInfo.name || '미입력'
            };
            const saveState = await saveHistory(entry);
            console.info('[HeavyGuard] 사진 저장', saveState === 'ok' ? '성공' : '실패(' + saveState + ')',
                         'id=' + id, 'dayKey=' + entry.dayKey, '촬영=' + entry.timeLabel);
            return { id, timeSlot: entry.timeSlot, saveState, pending };
        };

        // 응답 텍스트를 보고서 객체로 변환 (단건·묶음 공용)
        const parseReport = (raw) => {
            const cleaned = (raw || '').replace(/```json\n?|\n?```/g, '').trim();
            try { return JSON.parse(cleaned); }
            catch (err) {
                try {
                    const r = JSON.parse(salvageJson(cleaned));
                    r.truncated = true;
                    console.warn('[HeavyGuard] 잘린 JSON 을 복구했습니다');
                    return r;
                } catch (err2) {
                    console.error('JSON 파싱 실패:', err);
                    return null;
                }
            }
        };

        const failReport = (msg) => ({
            riskLevel: '주의',
            summary: '분석 실패: ' + msg + ' (사진은 저장되어 있습니다. 기록에서 다시 진단하세요.)',
            hazards: [], immediateActions: [], recommendations: [], analysisFailed: true
        });

        // ─── 여러 장 묶음 분석 ───
        //  무료 티어 한도는 '분당 요청 수'이므로, 사진을 BATCH_CHUNK 장씩 묶어 호출 수를 줄인다.
        //  15장이면 15회가 아니라 3회로 끝나 한도 대기 없이 처리된다.
        //  묶음을 더 크게 잡으면 호출은 줄지만 응답이 길어져 잘릴 위험이 커지고,
        //  한 번의 실패로 잃는 사진 수도 늘어난다. 5장이 그 균형점이다.
        const BATCH_CHUNK = 5;

        const runBatchAnalysis = async (files) => {
            const results = [];

            // ── 1단계: 전부 먼저 저장한다 (분석보다 사진 확보가 우선) ──
            const saved = [];
            for (let i = 0; i < files.length; i++) {
                setBatchProgress({ current: i + 1, total: files.length });
                setLoadingMsg(`사진 저장 중 (${i + 1}/${files.length})...`);
                try {
                    const shot = await getShotTime(files[i]);
                    const b64 = await resizeImageToBase64(files[i]);
                    const rec = await savePhotoEntry(b64, shot);
                    const t = `${String(shot.getHours()).padStart(2,'0')}${String(shot.getMinutes()).padStart(2,'0')}`;
                    saved.push({ ...rec, b64, no: i + 1, shotLabel: t });
                } catch (err) {
                    console.error(`${i + 1}번째 사진 오류:`, err);
                    saved.push({ id: null, saveState: 'none', no: i + 1, error: err.message });
                }
            }
            saved.forEach(r => results.push({ id: r.id, timeSlot: r.timeSlot, no: r.no,
                                              saveState: r.saveState,
                                              analysisFailed: r.saveState !== 'ok' }));

            // 저장에 성공한 사진을 한 번에 백업 (묶음이라도 메시지 수를 최소화)
            const backupPhotos = saved
                .filter(r => r.saveState === 'ok' && r.b64)
                .map(r => ({ dataUrl: r.b64, name: `${r.shotLabel || ''}_photo.jpg` }));
            relayBackup(backupPhotos);

            const targets = saved.filter(r => r.saveState === 'ok');
            if (!targets.length || !apiKey) {
                if (!apiKey) setIsKeyModalOpen(true);
                return results;
            }

            // ── 2단계: BATCH_CHUNK 장씩 묶어 분석 ──
            const chunks = [];
            for (let i = 0; i < targets.length; i += BATCH_CHUNK) chunks.push(targets.slice(i, i + BATCH_CHUNK));
            console.info('[HeavyGuard] 묶음 분석', targets.length, '장 →', chunks.length, '회 호출');

            const monitorWasOn = monitoringOnRef.current;
            monitoringOnRef.current = false;
            try {
                for (let c = 0; c < chunks.length; c++) {
                    const chunk = chunks[c];
                    setBatchProgress({ current: c + 1, total: chunks.length });
                    setLoadingMsg(`AI 분석 중 (${c + 1}/${chunks.length}묶음, 사진 ${chunk.length}장)...`);
                    let reports = null, errMsg = '';
                    try {
                        const res = await callGeminiAPI(batchAnalysisPrompt(chunk.length),
                                                        chunk.map(t => t.b64), apiKey, true,
                                                        (msg) => setLoadingMsg(msg));
                        if (res.success) {
                            const parsed = parseReport(res.text);
                            const arr = parsed && Array.isArray(parsed.results) ? parsed.results : null;
                            if (arr) reports = arr;
                            else errMsg = '응답 형식이 올바르지 않습니다';
                        } else {
                            errMsg = res.message || '알 수 없는 오류';
                            if (res.errorType === 'AUTH') setIsKeyModalOpen(true);
                        }
                    } catch (e) {
                        console.error(e); errMsg = e.message || '분석 중 오류';
                    }

                    chunk.forEach((t, k) => {
                        // idx 로 되돌려 붙이고, idx 가 없으면 순서대로 대응시킨다
                        const r = reports
                            ? (reports.find(x => Number(x.idx) === k) || reports[k] || null)
                            : null;
                        const rec = results.find(x => x.id === t.id);
                        if (r) {
                            updateHistoryEntry(t.id, { report: r });
                            if (rec) rec.analysisFailed = false;
                        } else {
                            updateHistoryEntry(t.id, { report: failReport(errMsg || '결과 누락') });
                            if (rec) rec.analysisFailed = true;
                        }
                    });
                }
            } finally {
                monitoringOnRef.current = monitorWasOn;
            }
            return results;
        };

        // 순서가 중요하다: 사진을 '먼저' 저장하고 그 다음에 분석한다.
        //  분석 뒤에 저장하면, 분석이 실패하거나 할당량 대기에 걸렸을 때
        //  사진 자체가 남지 않아 '저장이 문제인지 분석이 문제인지' 구분할 수 없다.
        //  현장 사진은 재촬영이 불가능하므로 무슨 일이 있어도 먼저 확보한다.
        const runAnalysis = async (base64Img, skipFinalize = false, silent = false, shotAt = null) => {
            console.info('[HeavyGuard] 분석 시작 (이미지', Math.round(base64Img.length / 1024), 'KB)');
            setCapturedImage(base64Img);

            // ── 1단계: 저장 ── (묶음 분석과 동일한 저장 경로를 쓴다)
            if (!skipFinalize) setLoadingMsg('사진을 저장하는 중...');
            const { id, timeSlot, saveState, pending } = await savePhotoEntry(base64Img, shotAt);
            if (saveState === 'ok') {
                // 저장에 성공한 사진만 백업 (실패한 사진은 남길 곳도 없다)
                const shot = shotAt instanceof Date && !isNaN(shotAt) ? shotAt : new Date();
                const t = `${String(shot.getHours()).padStart(2,'0')}${String(shot.getMinutes()).padStart(2,'0')}`;
                relayBackup([{ dataUrl: base64Img, name: `${t}_photo.jpg` }]);
            }
            if (saveState !== 'ok') {
                // 저장 자체가 실패한 경우 — 분석해봐야 남길 곳이 없다
                if (!skipFinalize) {
                    setIsAnalyzing(false);
                    alert('사진을 저장하지 못했습니다.\n브라우저의 저장공간이 막혀 있거나 가득 찼을 수 있습니다.\n(시크릿 모드에서는 저장되지 않습니다)');
                }
                return { id, timeSlot, saveState, analysisFailed: false };
            }

            // ── 2단계: 분석 ──
            if (!apiKey) {
                console.warn('[HeavyGuard] API 키 없음 → 분석 생략 (사진은 저장됨)');
                setIsKeyModalOpen(true);
                if (!skipFinalize) setIsAnalyzing(false);
                return { id, timeSlot, saveState, analysisFailed: true };
            }

            let analysisFailed = false;
            // 분석 동안 TF.js 실시간 감지를 일시 중지 (모바일 CPU/GPU 경합 제거)
            const monitorWasOn = monitoringOnRef.current;
            monitoringOnRef.current = false;
            if (!skipFinalize) setLoadingMsg('AI가 이미지를 분석하고 있습니다...');
            try {
                // 대기 중임을 화면에 알려, 멈춘 것처럼 보이지 않게 한다
                const result = await callGeminiAPI(ANALYSIS_PROMPT, base64Img, apiKey, true,
                                                   (msg) => setLoadingMsg(msg));
                let parsed;
                if (result.success) {
                    const cleaned = result.text.replace(/```json\n?|\n?```/g, '').trim();
                    try {
                        parsed = JSON.parse(cleaned);
                    } catch (err) {
                        // 잘린 응답이면 살려서 다시 시도한다
                        try {
                            parsed = JSON.parse(salvageJson(cleaned));
                            parsed.truncated = true;
                            console.warn('[HeavyGuard] 잘린 JSON 을 복구했습니다');
                        } catch (err2) {
                            console.error("JSON 파싱 실패:", err);
                            analysisFailed = true;
                            parsed = { riskLevel: '주의', summary: cleaned || '응답을 해석하지 못했습니다.',
                                       hazards: [], immediateActions: [], recommendations: [], parseFailed: true };
                        }
                    }
                } else {
                    analysisFailed = true;
                    parsed = { riskLevel: '주의',
                               summary: '분석 실패: ' + (result.message || '알 수 없는 오류')
                                        + ' (사진은 저장되어 있습니다. 기록에서 다시 진단하세요.)',
                               hazards: [], immediateActions: [], recommendations: [], analysisFailed: true };
                    if (!skipFinalize) alert(`사진은 저장되었습니다.\n분석만 실패했습니다: ${result.message}`);
                    if (result.errorType === 'AUTH') setIsKeyModalOpen(true);
                }
                // ── 3단계: 저장된 기록에 분석 결과를 채워 넣는다 ──
                updateHistoryEntry(id, { report: parsed });
                setReportData(parsed);
                if (!silent && !analysisFailed) setShowReport(true);   // 일지에서 추가 시엔 보고서 팝업 생략
            } catch (e) {
                console.error(e);
                analysisFailed = true;
                updateHistoryEntry(id, { report: { ...pending,
                    summary: '분석 중 오류가 발생했습니다. (사진은 저장되어 있습니다.)', analysisFailed: true } });
                if (!skipFinalize) alert('사진은 저장되었습니다.\n분석 중 오류가 발생했습니다.');
            } finally {
                monitoringOnRef.current = monitorWasOn;
                if (!skipFinalize) setIsAnalyzing(false);
            }
            return { id, timeSlot, saveState, analysisFailed };
        };

        // ObjectURL 로 디코딩한다. FileReader 로 원본을 base64 문자열(원본의 1.33배)로
        //  만들어 들고 있으면, 고화소 사진 여러 장을 연속 처리할 때 모바일에서
        //  메모리가 터져 탭이 통째로 재시작되고 분석 중이던 기록이 사라진다.
        const resizeImageToBase64 = (file) => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            const cleanup = () => { try { URL.revokeObjectURL(url); } catch (e) {} img.src = ''; };
            img.onerror = () => { cleanup(); reject(new Error(`이미지 로드 실패: ${file.name}`)); };
            img.onload = () => {
                try {
                    const MAX = 1280;
                    let w = img.width, h = img.height;
                    if (w > MAX || h > MAX) {
                        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                        else { w = Math.round(w * MAX / h); h = MAX; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const out = canvas.toDataURL('image/jpeg', 0.75);
                    canvas.width = canvas.height = 0;   // 캔버스 버퍼 즉시 해제
                    resolve(out);
                } catch (e) {
                    reject(new Error(`이미지 변환 실패: ${file.name}`));
                } finally { cleanup(); }
            };
            img.src = url;
        });

        const analyzeFromGallery = async (e) => {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;
            e.target.value = '';
            if (!apiKey) { setIsKeyModalOpen(true); return; }
            setIsAnalyzing(true);
            if (files.length === 1) {
                try {
                    const shot = await getShotTime(files[0]);
                    const b64 = await resizeImageToBase64(files[0]);
                    await runAnalysis(b64, false, false, shot);
                } catch (err) {
                    console.error(err);
                    alert(`이미지 처리 오류: ${err.message}`);
                    setIsAnalyzing(false);
                }
            } else {
                // 여러 장은 묶음 분석으로 처리한다 (호출 수를 줄여 무료 한도 대기를 없앤다)
                let results = [];
                try {
                    results = await runBatchAnalysis(files);
                } finally {
                    setBatchProgress(null);
                    setIsAnalyzing(false);
                }
                // 저장 실패와 분석 실패를 구분해서 알린다
                const bad = results.filter(r => r.saveState !== 'ok' || r.analysisFailed);
                if (bad.length) {
                    const lines = bad.map(r => r.saveState !== 'ok'
                        ? `${r.no}번 ▸ 사진 저장 실패`
                        : `${r.no}번 ▸ 분석 실패 (사진은 저장됨)`);
                    alert(`사진 ${results.length}장 중 ${bad.length}건에 문제가 있었습니다.\n\n`
                          + lines.join('\n')
                          + `\n\n'분석 실패'는 사진이 기록에 남아 있으니 다시 진단하면 됩니다.`);
                }
            }
        };

        // ─── 정밀 진단 (카메라 촬영) ───
        const analyzeSnapshot = async () => {
            if (!apiKey) { setIsKeyModalOpen(true); return; }
            // 카메라 준비 상태 확인
            if (!videoRef.current || !videoRef.current.videoWidth || !videoRef.current.videoHeight) {
                alert('카메라가 아직 준비되지 않았습니다. 잠시 후 다시 시도해주세요.');
                return;
            }
            setIsAnalyzing(true);
            // 셔터 플래시 효과
            const flash = document.createElement('div');
            flash.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;opacity:0.8;transition:opacity 0.2s';
            document.body.appendChild(flash);
            setTimeout(() => { flash.style.opacity='0'; setTimeout(()=>flash.remove(),200); }, 50);
            try {
                // 1280px / q0.75 : 위험요소 판독에 충분하면서 업로드 용량을 크게 줄인다
                const SNAP_MAX = 1280;
                const vw = videoRef.current.videoWidth, vh = videoRef.current.videoHeight;
                const ratio = Math.min(1, SNAP_MAX / Math.max(vw, vh));
                const snapCanvas = document.createElement('canvas');
                snapCanvas.width = Math.round(vw * ratio);
                snapCanvas.height = Math.round(vh * ratio);
                snapCanvas.getContext('2d').drawImage(videoRef.current, 0, 0, snapCanvas.width, snapCanvas.height);
                await runAnalysis(snapCanvas.toDataURL('image/jpeg', 0.75));
            } catch (e) {
                console.error("촬영 오류:", e);
                alert("촬영 중 오류가 발생했습니다.");
                setIsAnalyzing(false);
            }
        };

        // ─── 수정 4: 채팅 마크다운 렌더링 수정 ───
        // 원본: marked.parse(text).replace(/<[^>]+>/g, '') → HTML 파싱 후 태그 제거 = 서식 모두 소실
        // 개선: dangerouslySetInnerHTML로 제대로 렌더링
        const handleChatSubmit = async (e) => {
            e.preventDefault();
            if (!chatInput.trim() || isChatLoading) return;
            const userMsg = chatInput.trim();
            setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
            setChatInput('');
            setIsChatLoading(true);

            if (!apiKey) {
                setChatMessages(prev => [...prev, { sender: 'ai', text: 'API 키 설정이 필요합니다. 우측 상단 ⚙️ 버튼을 눌러주세요.' }]);
                setIsChatLoading(false);
                return;
            }

            const prompt = `당신은 대한민국 KOSHA(안전보건공단) 기준을 준수하는 건설 안전 전문가 AI입니다.
아래 질문에 대해 산업안전보건법, KOSHA Guide, 건설기술진흥법 등 관련 기준을 근거로 현장 작업자가 이해하기 쉽게 답변하세요.
마크다운 형식으로 구조화하여 답변하되, 핵심 내용은 굵게 표시하세요. 법 조문이나 가이드 번호가 있으면 반드시 명시하세요.

질문: "${userMsg}"`;

            const result = await callGeminiAPI(prompt, null, apiKey);
            const aiText = result.success ? result.text : `오류가 발생했습니다: ${result.message}`;
            setChatMessages(prev => [...prev, { sender: 'ai', text: aiText }]);
            setIsChatLoading(false);
        };

        // ═══════════════════════════════════════
        //  일일 지원일지 자동 생성
        // ═══════════════════════════════════════
        const KDAYS = ['일','월','화','수','목','금','토'];
        const todayKey = () => {
            const n = new Date();
            return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
        };
        const fmtKDate = (d = new Date()) =>
            `'${String(d.getFullYear()).slice(2)}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}(${KDAYS[d.getDay()]})`;

        // 오늘 기록만 추출 (dayKey 없는 구버전 기록은 date 문자열로 보조 판별)
        const todayEntries = () => {
            const tk = todayKey();
            const todayStr = new Date().toLocaleDateString('ko-KR');
            return history.filter(h => h.dayKey ? h.dayKey === tk : (h.date||'').startsWith(todayStr));
        };

        const openLogbook = () => {
            const list = todayEntries();
            const sel = {}, slots = {};
            list.forEach(h => { sel[h.id] = true; slots[h.id] = h.timeSlot || '오전'; });
            setLogSelected(sel);
            setLogSlots(slots);
            setLogMeta(prev => ({
                ...prev,
                site: prev.site || siteInfo.name || '',
                date: prev.date || fmtKDate(),
                supporter: prev.supporter || siteInfo.inspector || '',
            }));
            // 저장된 값이 프리셋에 없으면 직접입력 모드로 열기
            setCustomField({
                site:      !!(logMeta.site      && !SITE_PRESETS.includes(logMeta.site)),
                supporter: !!(logMeta.supporter && !STAFF_PRESETS.includes(logMeta.supporter)),
            });
            setLogResult(null);
            setShowLogbook(true);
        };

        const saveLogMeta = (m) => {
            setLogMeta(m);
            try { localStorage.setItem('heavyguard_logmeta', JSON.stringify(m)); } catch(e) {}
        };

        // ── 진단 기록 1건 삭제 (잘못 첨부한 사진 제거) ──
        const deleteHistoryItem = (id) => {
            setHistory(prev => {
                const next = prev.filter(h => h.id !== id);
                try {
                    localStorage.setItem('heavyguard_history',
