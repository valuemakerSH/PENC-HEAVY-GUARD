            if (!canAnalyze()) return;
            const picked = todayEntries().filter(h => logSelected[h.id]);
            if (!picked.length) { alert('일지에 포함할 진단 기록을 1건 이상 선택해주세요.'); return; }
            if(picked.some(h=>!h.report?.validated || h.report?.analysisFailed || h.report?.pending)){alert('선택한 사진 중 미완료 또는 이전 버전 결과가 있습니다. 개별 재분석 후 일지를 생성하세요.');return;}
            analysisLockRef.current=true;
            setIsGenLog(true);
            try {
                const payload = picked.map((h, i) => ({
                    idx: i,
                    촬영시각: h.timeLabel || '',
                    시간대: logSlots[h.id] || h.timeSlot || '오전',
                    위험등급: h.report?.riskLevel || '',
                    요약: h.report?.summary || '',
                    위험요소: (h.report?.hazards || []).map(z => `${z.title} [${z.category}] → ${z.action}`),
                    조치제안: (h.report?.immediateActions || []).slice(0, 3),
                    사용자확인조치: (h.report?.immediateActions || []).filter((_,j)=>h.actionChecks?.[j]),
                    미확인사항: h.report?.uncertainties || [],
                }));

                const existing = (logMeta.requests || '').split('\n').map(s => s.trim()).filter(Boolean);
                const hasReq = existing.length > 0;


                const prompt = `현장 안전관리 일일 지원결과 초안을 작성한다. 지정 JSON 구조를 따른다.
입력 idx를 정확히 한 번씩 모두 포함한다. 관찰 사실, 조치 제안, 사용자 확인 조치를 구분한다.
사용자확인조치에 없는 제안을 실제 이행·완료·통제 확인으로 바꾸지 않는다.
사진의 미확인사항을 숨기지 않는다. 문장은 짧은 개조식. 법 조문이나 미입력 지원 업무를 만들지 않는다.
requests는 빈 배열. 요청사항 자료: ${JSON.stringify(existing)}
items에는 idx, 입력 시간대 slot, group(입력 idx+1), line(점검 내용), sub(확인 상태·추가 조치)를 넣는다.
서로 다른 사진의 설명을 합치지 않는다. 각 사진은 독립 항목으로 보존한다. 내용 누락 없이 여러 페이지를 허용한다.
note에 초안 검토 필요 및 주요 미확인사항을 간결히 쓴다.
입력 자료: ${JSON.stringify(payload)}`;


                const res = await callGeminiAPI(prompt, null, apiKey, true, null, {schema:HGCore.logSchema});
                if (!res.success) {
                    alert(`일지 생성 오류: ${res.message}`);
                    if (res.errorType === 'AUTH') setIsKeyModalOpen(true);
                    setIsGenLog(false);
                    return;
                }
                let parsed;
                try {
                    parsed = HGCore.validateLog(HGCore.parseJSON(res.text),picked.length);
                } catch (e) {
                    console.error('일지 JSON 파싱 실패:', e, res.text);
                    alert('AI 응답 형식 오류입니다. 다시 시도해주세요.');
                    setIsGenLog(false);
                    return;
                }
                // 지원 업무가 비어 있었으면 AI 초안으로 채움
                const reqList = []; // Support requests must be entered by the user.
                if (!hasReq && reqList.length) {
                    saveLogMeta({ ...logMeta, requests: reqList.join('\n') });
                }
                const items = (parsed.items || []).map(it => ({
                    ...it,
                    line: '사진 점검 · ' + (picked[it.idx].report?.hazards?.[0]?.title || '현장 관찰'),
                    sub: (picked[it.idx].report?.immediateActions || []).length ? '조치 제안: ' + picked[it.idx].report.immediateActions.join(' / ') : '추가 확인: ' + (picked[it.idx].report?.uncertainties || ['현장 직접 확인']).join(' / '),
                    slot: logSlots[picked[it.idx].id] || picked[it.idx].timeSlot || '오전',
                    group: it.idx + 1,
                    entry: picked[it.idx],
                }));
                setLogResult({ items, note: '사진 관찰에 따른 점검 초안 · 미확인 사항과 조치 제안은 현장 확인 필요' });
            } catch (e) {
                console.error(e);
                alert('일지 생성 중 오류가 발생했습니다.');
            } finally {analysisLockRef.current=false;setIsGenLog(false);}

        };

        // 일지 텍스트 (복사용)
        const logbookAsText = () => {
            if (!logResult) return '';
            const L = [];
            L.push('현장 안전관리 일일 지원결과 공유');
            L.push('');
            L.push('Ⅰ. 지원 개요');
            L.push(`  ○ 현장명 : ${logMeta.site || ''}`);
            L.push(`  ○ 지원일자 : ${logMeta.date || ''}`);
            L.push(`  ○ 지원인원 : ${logMeta.supporter || ''}`);
            L.push('');
            L.push('Ⅱ. 지원 업무 (해당 현장으로부터 지원 요청 받은 사항)');
            (logMeta.requests || '').split('\n').filter(s => s.trim())
                .forEach((r, i) => L.push(`  ${i+1}) ${r.trim()}`));
            L.push('');
            L.push('Ⅲ. 지원 결과');
            ['오전','오후'].forEach(slot => {
                const items = logResult.items.filter(it => (it.slot || '오전') === slot);
                if (!items.length) return;
                L.push(`  [${slot}]`);
                items.forEach(it => {
                    L.push(`   • ${it.line}`);
                    if (it.sub) L.push(`     → ${it.sub}`);
                });
                L.push('');
            });
            if (logResult.note) { L.push(`※ 특이사항 : ${logResult.note}`); }
            return L.join('\n');
        };

        // ── 일지 PPTX 다운로드 (실제 사내 양식 좌표 그대로 재현) ──
        // PptxGenJS 확보 (CDN 실패 시 대체 경로로 재시도)
        const ensurePptx = async () => {
            if (window.PptxGenJS) return window.PptxGenJS;
            const urls = [
                'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
                'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
                'https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js',
            ];
            for (const u of urls) {
                try {
                    await new Promise((res, rej) => {
                        const el = document.createElement('script');
                        el.src = u;
                        el.onload = () => res();
                        el.onerror = () => rej(new Error('load error'));
                        document.head.appendChild(el);
                        setTimeout(() => rej(new Error('timeout')), 15000);
                    });
                    if (window.PptxGenJS) { console.info('[HeavyGuard] PPT 라이브러리 로드:', u); return window.PptxGenJS; }
                } catch (e) { console.warn('PPT 라이브러리 로드 실패:', u, e.message); }
            }
            return null;
        };

        // 이미지 원본 비율 측정 (가로/세로 혼재 대응)
        const measureImg = (src) => new Promise(res => {
            const im = new Image();
            im.onload  = () => res({ w: im.naturalWidth || 4, h: im.naturalHeight || 3 });
            im.onerror = () => res({ w: 4, h: 3 });
            im.src = src;
        });
        // 박스 안에 비율 유지하여 맞추고 중앙 정렬
        const fitBox = (bx, by, bw, bh, iw, ih) => {
            const r = Math.min(bw / iw, bh / ih);
            const w = iw * r, h = ih * r;
            return { x: bx + (bw - w) / 2, y: by + (bh - h) / 2, w, h };
        };

        // ── 일지 PPTX 다운로드 (사내 양식 좌표 재현) ──
        const downloadLogbookPPTX = async () => {
            if (!logResult) { alert('먼저 AI 일지를 생성해주세요.'); return; }
            setLoadingMsg('PPT 생성 준비 중...');
            const PptxCtor = await ensurePptx();
            if (!PptxCtor) {
                alert('PPT 라이브러리를 불러오지 못했습니다.\n네트워크 상태를 확인하거나, 아래 [텍스트 복사]로 기존 양식에 붙여넣어 주세요.');
                return;
            }

            // 모든 사진의 원본 비율을 먼저 측정
            const allSrc = [...new Set(logResult.items.filter(i => i.entry?.image).map(i => i.entry.image))];
            const dims = new Map();
            for (const src of allSrc) dims.set(src, await measureImg(src));

            const pptx = new PptxCtor();
            pptx.defineLayout({ name: 'SITE', width: 7.5, height: 10.83 });
            pptx.layout = 'SITE';

            // 서식: 글꼴 통일(맑은 고딕), 크기 = 섹션 16 / 개요 14 / 내용 12
            const FONT = '맑은 고딕';
            const SZ_SEC = 16, SZ_OVW = 14, SZ_BODY = 12;
            const SW = 7.5, SH = 10.83;
            const BANNER_H = 7.5 * 102 / 1107;             // 배너 원본 비율 = 0.691
            const TBL_X = 0.40, TBL_W = 6.93, C1 = 0.59;
            const C2_X = TBL_X + C1, C2_W = TBL_W - C1;
            const HDR_H = 0.29;
            const LINE = '7F9DB9';
            // 하단에 '※ 지원업무 수행 및 결과공유 절차'가 y=9.52 에 고정 배치되고
            // 그 위에 '※ 특이사항' 한 줄이 들어가므로, 본문은 9.30 에서 끝나야 한다.
            // (기존 10.42 는 이 고정 영역을 무시한 값이라 본문이 항상 다음 장으로 밀렸다)
            const BOTTOM_LIMIT = 9.30;
            // 사진 박스 — 실제 사내 양식('25.11.21 서소문 지원결과)의 사진 좌표를 실측한 값.
            //  원본은 x=1.40 / 4.36, w=2.76, h=1.18 로 배치돼 있고,
            //  이 낮은 높이 덕분에 사진 3줄(6장)이 1페이지에 들어간다.
            //  기존 2.10 은 거의 두 배라 3줄이면 무조건 3페이지가 됐다.
            const BOX2_W = 2.76, BOX2_H = 1.00;
            const BOX2_X = [1.40, 4.36];
            const BOX1_W = 3.60, BOX1_H = 1.10;   // 1장짜리 묶음도 2장 묶음과 비슷한 높이여야 1페이지에 들어간다
            // 12pt 기준 줄높이
            const LH = 0.20, LH_SUB = 0.19;
            // 사진 아래 / 묶음 사이 여백 (사내 양식 실측 기준으로 축소)
            const PIC_GAP = 0.08, GRP_GAP = 0.04;

            const newSlide = (contTitle) => {
                const s = pptx.addSlide();
                s.addImage({ data: BANNER_B64, x: 0, y: 0, w: SW, h: BANNER_H });
                // 제목: 배너 안에서 살짝 위쪽에 배치
                s.addText('현장 안전관리 일일 지원결과 공유', {
                    x: 0.16, y: 0.02, w: 5.6, h: BANNER_H - 0.14,
                    fontSize: 20, bold: true, color: '1A1A1A', fontFace: FONT, valign: 'middle',
                });
                if (contTitle) s.addText('Ⅲ. 지원 결과 (계속)', {
                    x: 0.16, y: 0.80, w: 7.13, h: 0.32,
                    fontSize: SZ_SEC, bold: true, color: '000000', fontFace: FONT,
                });
                return s;
            };

            const nLines = (t, per) => Math.max(1, Math.ceil((t || '').length / per));

            // 한 줄을 넘기면 아래 묶음이 전부 밀려 페이지가 늘어난다.
            //  프롬프트로 길이를 제한하지만 지켜지지 않을 때가 있어, 렌더 직전에 잘라
            //  '항상 한 줄'을 보장한다. (레이아웃을 결정적으로 만드는 쪽이 안전하다)
            const LINE_MAX = 38, SUB_MAX = 40;
            const clamp = (t, n) => {
                const v = (t || '').trim();
                return v.length > n ? v.slice(0, n - 1) + '…' : v;
            };

            // ── 같은 작업(group)끼리 묶기: 설명 1회 + 사진 최대 2장 ──
            const buildGroups = (items) => {
                const gs = [];
                items.forEach((it, i) => {
                    const key = (it.group !== undefined && it.group !== null) ? `g${it.group}` : `s${i}`;
                    let g = gs.find(x => x.key === key && x.items.length < 2);
                    if (!g) { g = { key, items: [] }; gs.push(g); }
                    g.items.push(it);
                });
                return gs;
            };
            const groupH = (g) => {
                const head = g.items[0];
                let h = nLines(clamp(head.line, LINE_MAX), 40) * LH;
                if (head.sub) h += nLines(clamp(head.sub, SUB_MAX), 40) * LH_SUB + 0.02;
                const np = g.items.filter(x => x.entry?.image).length;
                if (np >= 2) h += BOX2_H + PIC_GAP;
                else if (np === 1) h += BOX1_H + PIC_GAP;
                return h + GRP_GAP;
            };
            // startY에서 들어가는 묶음 개수 (남은 공간을 최대한 채움)
            const fitGroups = (startY, gs) => {
                let used = HDR_H + 0.08, n = 0;
                for (const g of gs) {
                    const h = groupH(g);
                    if (startY + used + h + GRP_GAP > BOTTOM_LIMIT) break;
                    used += h; n++;
                }
                return Math.max(1, n);
            };

            // 한 시간대 섹션 렌더 → 사용 높이 반환
            const renderSlot = (s, startY, slot, gs) => {
                let bodyH = 0.08;
                gs.forEach(g => { bodyH += groupH(g); });
                bodyH = Math.max(0.6, bodyH);

                // 헤더행
                s.addShape(pptx.ShapeType.rect, { x: TBL_X, y: startY, w: C1, h: HDR_H,
                    fill: { color: 'DCE6F2' }, line: { color: LINE, width: 1 } });
                s.addShape(pptx.ShapeType.rect, { x: C2_X, y: startY, w: C2_W, h: HDR_H,
                    fill: { color: 'DCE6F2' }, line: { color: LINE, width: 1 } });
                s.addText('구분', { x: TBL_X, y: startY, w: C1, h: HDR_H,
                    fontSize: SZ_BODY, bold: true, align: 'center', valign: 'middle', color: '1A1A1A', fontFace: FONT });
                s.addText('지원 결과', { x: C2_X, y: startY, w: C2_W, h: HDR_H,
                    fontSize: SZ_BODY, bold: true, align: 'center', valign: 'middle', color: '1A1A1A', fontFace: FONT });

                const bodyY = startY + HDR_H;
                s.addShape(pptx.ShapeType.rect, { x: TBL_X, y: bodyY, w: C1, h: bodyH,
                    fill: { color: 'FFFFFF' }, line: { color: LINE, width: 1 } });
                s.addShape(pptx.ShapeType.rect, { x: C2_X, y: bodyY, w: C2_W, h: bodyH,
                    line: { color: LINE, width: 1 } });
                s.addText(slot, { x: TBL_X, y: bodyY, w: C1, h: bodyH,
                    fontSize: SZ_BODY, bold: true, align: 'center', valign: 'middle', color: '1A1A1A', fontFace: FONT });

                let ty = bodyY + 0.06;
                gs.forEach(g => {
                    const head = g.items[0];
                    const lineT = clamp(head.line, LINE_MAX), subT = clamp(head.sub, SUB_MAX);
                    const lh = nLines(lineT, 40) * LH;
                    s.addText(`• ${lineT}`, { x: C2_X + 0.10, y: ty, w: C2_W - 0.20, h: lh,
                        fontSize: SZ_BODY, color: '000000', fontFace: FONT, valign: 'top' });
                    ty += lh;
                    if (subT) {
                        const sh = nLines(subT, 40) * LH_SUB;
                        s.addText(`→ ${subT}`, { x: C2_X + 0.28, y: ty, w: C2_W - 0.38, h: sh,
                            fontSize: SZ_BODY, color: '000000', fontFace: FONT, valign: 'top' });
                        ty += sh + 0.02;
                    }
                    const pics = g.items.filter(x => x.entry?.image);
                    if (pics.length >= 2) {
                        pics.slice(0, 2).forEach((p, i) => {
                            const dim = dims.get(p.entry.image) || { w: 4, h: 3 };
                            const f = fitBox(BOX2_X[i], ty + 0.02, BOX2_W, BOX2_H, dim.w, dim.h);
                            try { s.addImage({ data: p.entry.image, x: f.x, y: f.y, w: f.w, h: f.h }); }
                            catch (e) { console.warn('이미지 삽입 실패', e); }
                        });
                        ty += BOX2_H + PIC_GAP;
                    } else if (pics.length === 1) {
                        const dim = dims.get(pics[0].entry.image) || { w: 4, h: 3 };
                        const bx = C2_X + (C2_W - BOX1_W) / 2;
                        const f = fitBox(bx, ty + 0.02, BOX1_W, BOX1_H, dim.w, dim.h);
                        try { s.addImage({ data: pics[0].entry.image, x: f.x, y: f.y, w: f.w, h: f.h }); }
                        catch (e) { console.warn('이미지 삽입 실패', e); }
                        ty += BOX1_H + PIC_GAP;
                    }
                    ty += GRP_GAP;
                });

                return HDR_H + bodyH;
            };

            const groupOf = slot => logResult.items.filter(it => (it.slot || '오전') === slot);

            // 한 묶음이 현재 위치에 들어가는지
            const groupFits = (startY, g) => startY + HDR_H + 0.08 + groupH(g) + GRP_GAP <= BOTTOM_LIMIT;

            let slide = newSlide();
            let y, lastEndY = 0;

            // ── Ⅰ. 지원 개요 ──
            slide.addText('Ⅰ. 지원 개요', { x: 0.16, y: 0.80, w: 7.13, h: 0.32,
                fontSize: SZ_SEC, bold: true, color: '000000', fontFace: FONT });
            [['현장명', logMeta.site], ['지원일자', logMeta.date], ['지원인원', logMeta.supporter]]
                .forEach(([k, v], i) => {
                    slide.addText(`○ ${k} : ${v || ''}`, {
                        x: 0.45, y: 1.14 + i * 0.28, w: 6.9, h: 0.27,
                        fontSize: SZ_OVW, color: '000000', fontFace: FONT });
                });

            // ── Ⅱ. 지원 업무 ──
            slide.addText([
                { text: 'Ⅱ. 지원 업무 ', options: { fontSize: SZ_SEC, bold: true, color: '000000', fontFace: FONT } },
                { text: '(해당 현장으로부터 지원 요청 받은 사항)', options: { fontSize: SZ_BODY, color: '333333', fontFace: FONT } },
            ], { x: 0.16, y: 2.08, w: 7.13, h: 0.32 });

            // 5개부터는 Ⅲ 시작 위치가 밀려 지원 결과가 다음 장으로 넘어간다
            const reqs = (logMeta.requests || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 4);
            const reqH = Math.max(0.95, reqs.length * 0.235 + 0.14);
            slide.addShape(pptx.ShapeType.rect, { x: TBL_X, y: 2.46, w: TBL_W, h: reqH,
                fill: { color: 'FFFFFF' }, line: { color: LINE, width: 1 } });
            reqs.forEach((r, i) => {
                slide.addText(`${i + 1}) ${r}`, { x: TBL_X + 0.14, y: 2.53 + i * 0.235, w: TBL_W - 0.28, h: 0.23,
                    fontSize: SZ_BODY, color: '000000', fontFace: FONT });
            });

            // ── Ⅲ. 지원 결과 ──
            const secY = 2.46 + reqH + 0.14;
            slide.addText('Ⅲ. 지원 결과', { x: 0.16, y: secY, w: 7.13, h: 0.32,
                fontSize: SZ_SEC, bold: true, color: '000000', fontFace: FONT });
            y = secY + 0.36;

            // 묶음 단위로 페이지를 채운다.
            //  이전 구현은 시간대마다 '첫 슬라이드인가'를 따로 판단해서,
            //  오전 기록이 하나도 없으면 오후가 무조건 새 페이지에서 시작했다.
            //  (1페이지가 텅 빈 채로 남고 전체가 3페이지가 되던 원인)
            //  이제는 커서 하나(curY)로 이어 붙이고, 자리가 없을 때만 페이지를 넘긴다.
            let curY = y;

            const renderSlotPaged = (slotName) => {
                const gs = buildGroups(groupOf(slotName));
                if (!gs.length) return;
                let idx = 0;
                while (idx < gs.length) {
                    if (!groupFits(curY, gs[idx])) { slide = newSlide(true); curY = 1.22; }
                    const n = fitGroups(curY, gs.slice(idx));
                    const chunk = gs.slice(idx, idx + n);
                    curY += renderSlot(slide, curY, slotName, chunk) + 0.14;
                    lastEndY = curY;
                    idx += n;
                }
            };

            renderSlotPaged('오전');
            renderSlotPaged('오후');

            // ── 마지막 슬라이드 하단: 특이사항 + 절차 ──
            // 특이사항 한 줄(0.22)이 절차도(9.52) 앞에 들어갈 자리가 있으면 그대로 쓴다.
            //  기존에는 8.90 만 넘어도 새 장을 만들어, 마지막 페이지가 특이사항 한 줄만 담고 있었다.
            if (logResult.note && lastEndY > 9.28) { slide = newSlide(); lastEndY = 1.10; }
            if (logResult.note) {
                slide.addText(`※ 특이사항 : ${logResult.note}`, {
                    x: 0.16, y: Math.min(9.28, lastEndY + 0.04), w: 7.13, h: 0.22,
                    fontSize: 10, italic: true, color: '555555', fontFace: FONT });
            }
            slide.addText('※ 지원업무 수행 및 결과공유 절차', { x: 0.16, y: 9.52, w: 3.4, h: 0.26,
                fontSize: 11, bold: true, color: '333333', fontFace: FONT });
            const flow = [
                ['PM 의견을 받아, 지원인원에게\n일일 안전관리 업무내용 전달', '[현장 공무팀 → 지원인원]', 0.40],
                ['일일 안전관리 지원 수행하고,\n지원결과 작성하여 공무팀 제출', '[지원인원 → 현장 공무팀]', 2.89],
                ['개별 지원결과를 취합하여\nPM 보고 및 피드백 공유', '[현장 공무팀 → PM]', 5.20],
            ];
            flow.forEach(([body, cap, fx]) => {
                slide.addShape(pptx.ShapeType.rect, { x: fx, y: 9.82, w: 2.13, h: 0.48,
                    fill: { color: 'F2F6FA' }, line: { color: LINE, width: 0.75 } });
                slide.addText(body, { x: fx, y: 9.82, w: 2.13, h: 0.48,
                    fontSize: 8.5, align: 'center', valign: 'middle', color: '000000', fontFace: FONT });
                slide.addText(cap, { x: fx, y: 10.31, w: 2.13, h: 0.20,
                    fontSize: 8, align: 'center', color: '555555', fontFace: FONT });
            });

            for (const it of logResult.items) {
                const details=[it.line,it.sub,...(it.entry?.report?.uncertainties||[]).map(t=>'미확인: '+t)];
                if(details[0].length<=LINE_MAX && details[1].length<=SUB_MAX && details.length===2) continue;
                const lines=details.flatMap(t=>String(t||'').split(/\r?\n/).flatMap(p=>p.match(/.{1,36}/gu)||['']));
                for(let offset=0;offset<lines.length;offset+=30){
                    const appendix=newSlide('사진 점검 상세 · 후속 확인사항');
                    appendix.addText(lines.slice(offset,offset+30).join('\n'),{
                        x:0.55,y:1.2,w:6.4,h:7.6,fontSize:12,fontFace:FONT,color:'111111',
                        margin:0,breakLine:false,valign:'top',paraSpaceAfterPt:6
                    });
                }
            }
            const d = new Date();
            const ymd = `${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
            const site = (logMeta.site || '현장').replace(/[\\/:*?"<>|\s]/g, '_').slice(0, 20);
            const who = (logMeta.supporter || '').split(/[\s(]/)[0] || '지원인원';
            pptx.writeFile({ fileName: `${ymd}_현장_안전관리_일일_지원결과_${site}_${who}.pptx` });
        };

        // PDF 다운로드
        // 주의: jsPDF 기본 폰트(helvetica)는 한글 미지원
        // 한글 텍스트는 encodeURIComponent 후 표시하거나 '인쇄' 기능 권장
        // 현장 정보 저장
        const saveSiteInfo = (info) => {
            setSiteInfo(info);
            try {safeStore.setItem('heavyguard_site_info', JSON.stringify(info));} catch {setStorageNotice('현장 정보를 저장하지 못했습니다.');}
            setShowSiteForm(false);
        };

        return (
            <div className="relative h-full w-full bg-black">
                {/* 뷰파인더 */}
                <video ref={videoRef} autoPlay playsInline muted className="absolute inset-0 w-full h-full object-cover"/>
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full object-cover"/>

                {/* v9 monitor health: live means a fresh completed inference, never a safety judgment. */}
                <div className="absolute top-0 w-full px-4 pt-3 safe-area-top z-30">
                    <div className="flex items-center justify-between gap-2">
                        <span className="text-sm font-bold tracking-wide">HeavyGuard <span className="text-blue-300">AI v9</span></span>
                        <div className="flex gap-2">
                            <button aria-label="진단 기록" onClick={()=>setShowHistory(true)} className="p-2 rounded-full bg-black/50"><Icons.History size={19}/></button>
                            <button aria-label="현장 정보" onClick={()=>setShowSiteForm(true)} className="p-2 rounded-full bg-black/50"><Icons.FileText size={19}/></button>
                            {capabilities.torch && <button aria-label="카메라 조명" onClick={toggleFlash} className={`p-2 rounded-full ${flashOn?'bg-amber-300 text-black':'bg-black/50'}`}><Icons.Flash size={19}/></button>}
                            <button aria-label="설정" onClick={()=>setIsKeyModalOpen(true)} className="p-2 rounded-full bg-black/50"><Icons.Settings size={19}/></button>
                        </div>
                    </div>
                    <div className="hg-monitor-card mt-3 p-3 rounded-2xl bg-black/75 border border-white/15 max-w-lg" role="status" aria-live="polite">
                        <div className="flex items-center gap-2 text-sm font-bold">
                            <span className={`w-2.5 h-2.5 rounded-full ${monitorLive?'bg-blue-400':'bg-amber-400'}`}/>{monitorLabel}
                        </div>
                        <p className="text-xs text-gray-300 mt-1">
                            {monitorLive?`사람 ${monitorStats.people} · 차량 추정 ${monitorStats.vehicles} · 처리 ${Math.round(monitorStats.inferenceMs)}ms`:'감지 신호가 확인되기 전에는 직접 점검하세요.'}
                        </p>
                        <p className="text-[11px] text-gray-400 mt-1">마지막 감지 {monitorStats.last?`${Math.max(0,Math.floor((clock-monitorStats.last)/1000))}초 전`:'없음'} · {online?'인터넷 연결':'인터넷 끊김'}</p>
                        {monitorLive && alertState && <p className={`text-sm font-bold mt-2 p-2 rounded-lg ${alertState==='danger'?'bg-red-600':'bg-amber-500 text-black'}`}>{warningMsg}</p>}
                        <p className="text-[10px] text-gray-400 mt-2">사람·일반 차량 후보만 감지합니다. 굴착기·크레인·보호구·실제 거리는 보장하지 않습니다.</p>
                        <div className="flex gap-2 mt-3 flex-wrap">
                            <button onClick={cameraState==='ready'?stopCamera:()=>startCamera()} disabled={cameraState==='loading'} className="px-3 py-2 rounded-xl text-xs font-bold bg-white/15 disabled:opacity-40">{cameraState==='ready'?'카메라 정지':'카메라 시작'}</button>
                            {detectorState==='error' && <button onClick={loadDetector} className="px-3 py-2 bg-amber-600 rounded-xl text-xs">감지 모델 다시 불러오기</button>}
                            <button onClick={toggleAuto} aria-pressed={autoCheck} className={`px-3 py-2 rounded-xl text-xs font-bold ${autoCheck?'bg-blue-600':'bg-white/15'}`}>자동 재점검 {autoCheck?'ON':'OFF'} · 최소 30초</button>
                            <button onClick={async()=>{
                                if(!soundEnabled){try{const C=window.AudioContext||window.webkitAudioContext;if(C){audioRef.current=audioRef.current||new C();await audioRef.current.resume();}}catch{}}
                                setSoundEnabled(v=>!v);
                            }} aria-pressed={soundEnabled} className="px-3 py-2 rounded-xl text-xs bg-white/15">경고음 {soundEnabled?'ON':'OFF'}</button>
                        </div>
                        {cameraError && <p className="text-xs text-amber-300 mt-2">{cameraError}</p>}
                        {detectorError && <p className="text-xs text-amber-300 mt-2">{detectorError}</p>}
                        {(autoCheck||autoStatus) && <p className="text-xs text-blue-200 mt-2">{autoStatus||'첫 사진 재점검 대기 중'}{autoCheck?' · 선택한 장면을 Google Gemini로 전송':''}</p>}
                        {autoResult && <button onClick={openAutoReport} className="mt-2 text-left w-full border-t border-white/15 pt-2">
                            <span className="text-xs text-blue-200">최근 사진 결과 · {new Date(autoResult.frameAt).toLocaleTimeString('ko-KR')}</span>
                            <p className="text-sm mt-1">{autoResult.report.riskLevel} · {autoResult.report.summary}</p>
                            <span className="text-[10px] text-gray-400">{Math.max(0,Math.floor((clock-new Date(autoResult.frameAt).getTime())/1000))}초 전 촬영 · 현재 장면과 다를 수 있음 · 눌러서 보기</span>
                        </button>}
                    </div>
                </div>
                {storageNotice && <div className="absolute bottom-40 left-4 right-4 z-[61] rounded-xl p-3 bg-amber-100 text-amber-950 text-xs flex gap-3 shadow-xl" role="status">
                    <span className="flex-1">{storageNotice}</span><button aria-label="알림 닫기" onClick={()=>setStorageNotice('')}>닫기</button>
                </div>}


                {/* 우측 컨트롤 */}
                <div className="absolute right-4 top-1/2 -translate-y-1/2 z-20 flex flex-col items-center gap-6">
                    {cameras.length > 1 && (
                        <button onClick={switchCamera}
                            className="p-3 rounded-full bg-black/40 backdrop-blur text-white shadow-lg active:rotate-180 transition-transform">
                            <Icons.RotateCcw size={20}/>
                        </button>
                    )}
                    {capabilities.zoom && (
                        <div className="bg-black/40 backdrop-blur rounded-full py-4 w-10 h-48 flex flex-col items-center justify-center relative">
                            <span className="absolute top-3 text-[10px] font-bold opacity-80">Zoom</span>
                            <input type="range" min={capabilities.zoom.min} max={capabilities.zoom.max} step="0.1"
                                value={zoom} onChange={handleZoom}
                                className="w-32 h-10 -rotate-90 origin-center absolute top-20"/>
                            <span className="absolute bottom-3 text-[10px] font-mono opacity-80">{zoom.toFixed(1)}x</span>
                        </div>
                    )}
                </div>

                {/* 하단 독 */}
                <div className="absolute bottom-0 w-full safe-area-bottom pb-6 pt-4 bg-gradient-to-t from-black/90 to-transparent z-30 px-8">
                    <div className="flex justify-between items-end max-w-sm mx-auto">
                        {/* 숨겨진 갤러리 input */}
                        <input ref={galleryInputRef} type="file" accept="image/*" multiple
                            style={{display:'none'}} onChange={analyzeFromGallery}/>

                        {/* 모니터링 */}
                        <div className="flex flex-col items-center gap-2 mb-1" style={{width:46}}>
                            <button onClick={toggleMonitoring} aria-label="기기 내 감지 켜기 또는 끄기"
                                className={`dock-btn ${monitoringOn ? 'active' : ''}`} style={{width:42,height:42}}>
                                {monitoringOn ? <Icons.Eye size={18}/> : <Icons.EyeOff size={18} className="opacity-50"/>}
                            </button>
                            <span className="text-[10px] font-medium text-white/80">모니터링</span>
                        </div>

                        {/* 갤러리 분석 */}
                        <div className="flex flex-col items-center gap-2 mb-1" style={{width:46}}>
                            <button aria-label="갤러리 사진 선택" onClick={() => galleryInputRef.current?.click()}
                                disabled={isAnalyzing}
                                className="dock-btn text-white disabled:opacity-40" style={{width:42,height:42}}>
                                <Icons.Image size={18}/>
                            </button>
                            <span className="text-[10px] font-medium text-white/80">갤러리</span>
                        </div>

                        {/* 정밀 진단 셔터 */}
                        <div className="flex flex-col items-center gap-2 -mb-2">
                            <button onClick={analyzeSnapshot} aria-label="사진 정밀 진단" disabled={isAnalyzing || cameraState!=='ready'}
                                className="shutter-button shadow-[0_0_20px_rgba(0,0,0,0.5)] transform active:scale-95 transition-transform">
                                <div className="shutter-inner flex items-center justify-center">
                                    {isAnalyzing
                                        ? <Icons.Loader className="text-gray-500" size={28}/>
                                        : <Icons.Sparkles className="text-black" size={28}/>}
                                </div>
                            </button>
                            <span className="text-[11px] font-bold text-white mb-2">정밀 진단</span>
                        </div>

                        {/* AI 비서 */}
                        <div className="flex flex-col items-center gap-2 mb-1" style={{width:46}}>
                            <button onClick={() => setShowChat(true)}
                                className="dock-btn text-white" style={{width:42,height:42}}>
                                <Icons.MessageSquare size={18}/>
                            </button>
                            <span className="text-[10px] font-medium text-white/80">AI 비서</span>
                        </div>

                        {/* 일일 지원일지 */}
                        <div className="flex flex-col items-center gap-2 mb-1" style={{width:46}}>
                            <button onClick={openLogbook}
                                className="dock-btn text-white relative" style={{width:42,height:42}}>
                                <Icons.ClipboardList size={18}/>
                                {todayEntries().length > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-[#34C759] text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">
                                        {todayEntries().length > 9 ? '9+' : todayEntries().length}
                                    </span>
                                )}
                            </button>
                            <span className="text-[10px] font-medium text-white/80">일지</span>
                        </div>
                    </div>
                </div>

                {/* ── 채팅 모달 (수정 4: 마크다운 제대로 렌더링) ── */}
                {showChat && (
                    <div className="absolute inset-0 z-50 bg-[#1C1C1E] flex flex-col animate-slide-up">
                        <div className="bg-[#2C2C2E] border-b border-gray-700 p-4 safe-area-top flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <span className="bg-[#007AFF] p-1 rounded-md"><Icons.MessageSquare size={16} className="text-white"/></span>
                                AI 안전비서
                            </h2>
                            <button onClick={() => setShowChat(false)} className="bg-[#3A3A3C] p-2 rounded-full text-gray-300">
                                <Icons.X size={20}/>
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-4 hide-scrollbar">
                            {chatMessages.map((msg, idx) => (
                                <div key={idx} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                                    {msg.sender === 'user' ? (
                                        <div className="chat-bubble-user">
                                            <p className="text-sm leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                                        </div>
                                    ) : (
                                        <div className="chat-bubble-ai">
                                            {/* 수정 4: HTML 태그 제거 없이 마크다운 제대로 렌더링 */}
                                            <SafeMarkdown text={msg.text}/>
                                        </div>
                                    )}
                                </div>
                            ))}
                            {isChatLoading && (
                                <div className="flex justify-start">
                                    <div className="chat-bubble-ai flex items-center gap-2">
                                        <Icons.Loader size={16} className="text-gray-400"/>
                                        <span className="text-xs text-gray-400">답변 작성 중...</span>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef}/>
                        </div>
                        <div className="p-4 bg-[#2C2C2E] border-t border-gray-700 safe-area-bottom">
                            <form onSubmit={handleChatSubmit} className="flex gap-2">
                                <input type="text" value={chatInput} onChange={e=>setChatInput(e.target.value)}
                                    placeholder="안전 기준에 대해 물어보세요..."
                                    className="flex-1 bg-[#1C1C1E] text-white px-4 py-3 rounded-2xl border border-gray-600 focus:border-[#007AFF] outline-none text-sm placeholder:text-gray-500"/>
                                <button type="submit" disabled={isChatLoading}
                                    className="bg-[#007AFF] text-white p-3 rounded-full disabled:opacity-50 disabled:bg-gray-600">
                                    <Icons.Send size={20}/>
                                </button>
                            </form>
                        </div>
                    </div>
                )}

                {/* ── 전체 로딩 오버레이 ── */}
                {isAnalyzing && (
                    <div className="absolute inset-0 z-[58] flex flex-col items-center justify-center" style={{background:'rgba(0,0,0,0.75)',backdropFilter:'blur(8px)'}}>
                        <div className="ios-glass-dark rounded-3xl px-10 py-8 flex flex-col items-center gap-4 max-w-xs w-full mx-6">
                            <div className="w-16 h-16 rounded-full bg-[#007AFF]/20 flex items-center justify-center">
                                <Icons.Loader size={32} className="text-[#007AFF]"/>
                            </div>
                            <div className="text-center">
                                <p className="text-white font-bold text-base">{loadingMsg}</p>
                                {batchProgress && (
                                    <div className="mt-3 w-full">
                                        <div className="flex justify-between text-xs text-gray-400 mb-1">
                                            <span>진행</span><span>{batchProgress.current}/{batchProgress.total}</span>
                                        </div>
                                        <div className="w-full bg-gray-700 rounded-full h-1.5">
                                            <div className="bg-[#007AFF] h-1.5 rounded-full transition-all" style={{width:`${(batchProgress.current/batchProgress.total)*100}%`}}/>
                                        </div>
                                    </div>
                                )}
                                <p className="text-gray-400 text-xs mt-2">사진 관찰 분석 중 · 기기 내 감지 {monitorLive?'계속':'신호 확인 필요'}</p>
                                <button onClick={cancelAnalysis} className="mt-4 px-5 py-2 bg-white/15 rounded-xl text-sm">분석 취소</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* ── 보고서 모달 (수정 3: 완전 재설계) ── */}
                {showReport && (
                    <ReportView
                        reportData={reportData}
                        capturedImage={capturedImage}
                        key={activeEntry?.id || activeEntry?.shotISO || 'report'}
                        siteInfo={activeEntry?.siteInfo || {name:activeEntry?.siteName || '미기록',inspector:'미기록',weather:'미기록'}}
                        gpsCoords={activeEntry?.gps || null}
                        entry={activeEntry}
                        checkedItems={history.find(h=>h.id===activeEntry?.id)?.actionChecks || {}}
                        onCheck={(idx,value)=>{
                            if(!activeEntry?.id){setStorageNotice('기록에 저장한 다음 조치 확인을 체크하세요.');return;}
                            const item=historyRef.current.find(h=>h.id===activeEntry.id);
                            updateHistoryEntry(item.id,{actionChecks:{...item.actionChecks,[idx]:value},actionsUpdatedAt:new Date().toISOString()});
                        }}
                        onReanalyze={reanalyzeEntry}
                        onSaveAuto={saveAutoResult}
                        onClose={() => setShowReport(false)}
                    />
                )}

                {/* ── 현장 정보 입력 폼 ── */}
                {showSiteForm && (
                    <div className="absolute inset-0 z-[55] bg-black/80 backdrop-blur-sm flex items-end justify-center">
                        <div className="ios-glass-dark w-full max-w-sm p-6 rounded-t-3xl">
                            <h3 className="text-lg font-bold text-white mb-1">현장 정보</h3>
                            <p className="text-xs text-gray-400 mb-5">보고서 헤더에 표시됩니다</p>
                            {[
                                { key: 'name',      label: '현장명',   placeholder: '예: ○○아파트 신축 현장' },
                                { key: 'inspector', label: '점검자',   placeholder: '예: 홍길동 (안전관리자)' },
                                { key: 'weather',   label: '날씨',     placeholder: '예: 맑음 25°C' },
                            ].map(({ key, label, placeholder }) => (
                                <div key={key} className="mb-3">
                                    <label className="text-xs text-gray-400 block mb-1">{label}</label>
                                    <input type="text" value={siteInfo[key]}
                                        onChange={e => setSiteInfo(prev => ({ ...prev, [key]: e.target.value }))}
                                        placeholder={placeholder}
                                        className="w-full bg-white/10 border border-white/10 rounded-xl p-3 text-white text-sm outline-none focus:border-[#007AFF] placeholder:text-gray-600"/>
                                </div>
                            ))}

                            <div className="flex gap-3 mt-4">
                                <button onClick={() => setShowSiteForm(false)} className="flex-1 py-3 text-gray-400 text-sm font-medium">취소</button>
                                <button onClick={() => saveSiteInfo(siteInfo)} className="flex-1 py-3 bg-[#007AFF] text-white rounded-xl font-bold text-sm">저장</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* ── 일일 지원일지 모달 ── */}
                {showLogbook && (
                    <div className="absolute inset-0 z-50 bg-[#1C1C1E] flex flex-col animate-slide-up">
                        <div className="bg-[#2C2C2E] border-b border-gray-700 p-4 safe-area-top flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <span className="bg-[#34C759] p-1 rounded-md"><Icons.ClipboardList size={16} className="text-white"/></span>
                                일일 지원일지
                            </h2>
                            <button onClick={() => setShowLogbook(false)} className="bg-[#3A3A3C] p-2 rounded-full text-gray-300">
                                <Icons.X size={20}/>
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-4 pb-6">

                            {/* Ⅰ. 지원 개요 */}
                            <div className="bg-[#2C2C2E] rounded-2xl p-4 border border-gray-700">
                                <h3 className="text-sm font-bold text-white mb-3">Ⅰ. 지원 개요</h3>
                                {[
                                    { key:'site',      label:'현장명',   opts: SITE_PRESETS,  ph:'현장명을 직접 입력하세요' },
                                    { key:'supporter', label:'지원인원', opts: STAFF_PRESETS, ph:'예: 홍길동 공사계약그룹' },
                                ].map(({key,label,opts,ph}) => (
                                    <div key={key} className="mb-2.5">
                                        <label className="text-[11px] text-gray-400 block mb-1">{label}</label>
                                        <select
                                            value={customField[key] ? '__custom__' : (opts.includes(logMeta[key]) ? logMeta[key] : '')}
                                            onChange={e => {
                                                const v = e.target.value;
                                                if (v === '__custom__') {
                                                    setCustomField(p => ({ ...p, [key]: true }));
                                                    saveLogMeta({ ...logMeta, [key]: '' });
                                                } else {
                                                    setCustomField(p => ({ ...p, [key]: false }));
                                                    saveLogMeta({ ...logMeta, [key]: v });
                                                }
                                            }}
                                            className="w-full bg-[#1C1C1E] border border-gray-600 rounded-xl px-3 py-2.5 text-white text-sm outline-none focus:border-[#34C759] appearance-none"
                                            style={{ backgroundImage:"url(\"data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e\")", backgroundRepeat:'no-repeat', backgroundPosition:'right 12px center', backgroundSize:'16px' }}>
                                            <option value="">선택하세요</option>
                                            {opts.map(o => <option key={o} value={o}>{o}</option>)}
                                            <option value="__custom__">직접 입력…</option>
                                        </select>
                                        {customField[key] && (
                                            <input type="text" value={logMeta[key] || ''} autoFocus
                                                onChange={e => saveLogMeta({ ...logMeta, [key]: e.target.value })}
                                                placeholder={ph}
                                                className="w-full mt-2 bg-[#1C1C1E] border border-[#34C759]/60 rounded-xl px-3 py-2.5 text-white text-sm outline-none focus:border-[#34C759] placeholder:text-gray-600"/>
                                        )}
                                    </div>
                                ))}
                                {/* 지원일자 */}
                                <div className="mb-2.5">
                                    <label className="text-[11px] text-gray-400 block mb-1">지원일자</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={logMeta.date || ''}
                                            onChange={e => saveLogMeta({ ...logMeta, date: e.target.value })}
                                            placeholder="예: '25.11.20(목)"
                                            className="flex-1 bg-[#1C1C1E] border border-gray-600 rounded-xl px-3 py-2.5 text-white text-sm outline-none focus:border-[#34C759] placeholder:text-gray-600"/>
                                        <button onClick={() => saveLogMeta({ ...logMeta, date: fmtKDate() })}
                                            className="px-3 rounded-xl bg-gray-700 text-gray-200 text-xs font-medium whitespace-nowrap">오늘</button>
                                    </div>
                                </div>
                            </div>

                            {/* Ⅱ. 지원 업무 */}
                            <div className="bg-[#2C2C2E] rounded-2xl p-4 border border-gray-700">
                                <h3 className="text-sm font-bold text-white mb-1">Ⅱ. 지원 업무</h3>
                                <p className="text-[11px] text-gray-500 mb-2">
                                    비워두면 아래 <span className="text-[#4ADE80]">AI 지원일지 자동 작성</span> 시 함께 작성됩니다 · 한 줄에 하나씩
                                </p>
                                <textarea rows={4} value={logMeta.requests || ''}
                                    onChange={e => saveLogMeta({ ...logMeta, requests: e.target.value })}
                                    placeholder={"중장비(항타기, 기중기, 굴착기) 작업 시 주변 통제 확인\nGATE1 램프 조성 및 성토 시 주변 통제 상태 안전지원\nPRD 용접작업 시 주변 인화성 물질 제거 등 화재예방 관리\nCCTV 모니터링"}
                                    className="w-full bg-[#1C1C1E] border border-gray-600 rounded-xl px-3 py-2.5 text-white text-sm outline-none focus:border-[#34C759] placeholder:text-gray-600 leading-relaxed resize-none"/>
                            </div>

                            {/* Ⅲ. 오늘 진단 기록 선택 */}
                            <div className="bg-[#2C2C2E] rounded-2xl p-4 border border-gray-700">
                                <div className="flex items-center justify-between mb-1">
                                    <h3 className="text-sm font-bold text-white">Ⅲ. 오늘 진단 기록</h3>
                                    <div className="flex items-center gap-2">
                                        <span className="text-[11px] bg-gray-700 text-gray-300 px-2 py-0.5 rounded-full">
                                            {todayEntries().filter(h => logSelected[h.id]).length} / {todayEntries().length}
                                        </span>
                                        {todayEntries().length > 0 && (() => {
                                            const list = todayEntries();
                                            const allOn = list.every(h => logSelected[h.id]);
                                            return (
                                                <button onClick={() => {
                                                    const next = {};
                                                    list.forEach(h => { next[h.id] = !allOn; });
                                                    setLogSelected(prev => ({ ...prev, ...next }));
                                                }} className="text-[11px] bg-gray-700 text-gray-200 px-2.5 py-1 rounded-lg font-medium">
                                                    {allOn ? '전체 해제' : '전체 선택'}
                                                </button>
                                            );
                                        })()}
                                        <button onClick={() => logPhotoInputRef.current?.click()} disabled={isAnalyzing}
                                            className="flex items-center gap-1 text-[11px] bg-[#34C759]/20 text-[#4ADE80] px-2.5 py-1 rounded-lg font-medium disabled:opacity-40">
                                            <Icons.Image size={11}/> 사진 추가
                                        </button>
                                    </div>
                                </div>
                                <input ref={logPhotoInputRef} type="file" accept="image/*" multiple
                                    style={{display:'none'}} onChange={addPhotosToLog}/>
                                <p className="text-[11px] text-gray-500 mb-3">일지에 넣을 기록을 고르고 오전/오후를 지정하세요</p>

                                {todayEntries().length === 0 ? (
                                    <div className="text-center py-7 text-gray-500">
                                        <Icons.Camera size={30} className="opacity-30 mx-auto mb-2"/>
                                        <p className="text-xs mb-1">오늘 진단한 기록이 없습니다</p>
                                        <p className="text-[11px] text-gray-600 mb-4">현장에서 찍은 사진을 불러오면<br/>AI가 분석해서 일지 항목으로 만듭니다</p>
                                        <button onClick={() => logPhotoInputRef.current?.click()} disabled={isAnalyzing}
                                            className="inline-flex items-center gap-1.5 bg-[#34C759] text-white px-4 py-2.5 rounded-xl text-xs font-bold disabled:opacity-40">
                                            <Icons.Image size={14}/> 갤러리에서 사진 불러오기
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {todayEntries().map(h => {
                                            const on = !!logSelected[h.id];
                                            const slot = logSlots[h.id] || h.timeSlot || '오전';
                                            return (
                                                <div key={h.id} className={`rounded-xl border p-2.5 transition-all ${on ? 'bg-[#1C1C1E] border-[#34C759]/50' : 'bg-[#1C1C1E]/40 border-gray-700 opacity-50'}`}>
                                                    <div className="flex gap-2.5 items-start">
                                                        <button onClick={() => setLogSelected(p => ({ ...p, [h.id]: !on }))}
                                                            className={`w-5 h-5 rounded-md border-2 flex-shrink-0 mt-0.5 flex items-center justify-center ${on ? 'bg-[#34C759] border-[#34C759]' : 'border-gray-500'}`}>
                                                            {on && <span className="text-white text-[11px] font-bold">✓</span>}
                                                        </button>
                                                        {h.image && <img src={h.image} className="w-12 h-12 rounded-lg object-cover flex-shrink-0 bg-black"/>}
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center gap-1.5 mb-1">
                                                                <span className="text-[10px] text-gray-400">{h.timeLabel || ''}</span>
                                                                <span className="text-[10px] text-orange-400">위험 {h.report?.hazards?.length || 0}건</span>
                                                            </div>
                                                            <p className="text-[11px] text-gray-300 leading-snug line-clamp-2">
                                                                {(h.report?.hazards || []).map(z => z.title).join(', ') || h.report?.summary?.slice(0,50) || '-'}
                                                            </p>
                                                        </div>
                                                        <div className="flex flex-col gap-1 flex-shrink-0">
                                                            {['오전','오후'].map(s => (
                                                                <button key={s} onClick={() => setLogSlots(p => ({ ...p, [h.id]: s }))}
                                                                    className={`text-[10px] px-2 py-1 rounded-md font-medium flex items-center gap-1 ${slot === s ? 'bg-[#007AFF] text-white' : 'bg-gray-700 text-gray-400'}`}>
                                                                    {s === '오전' ? <Icons.Sun size={10}/> : <Icons.Moon size={10}/>}{s}
                                                                </button>
                                                            ))}
                                                        </div>
                                                        <button onClick={() => {
                                                                if (confirm('이 기록을 삭제할까요?\n첨부된 사진도 함께 삭제됩니다.')) deleteHistoryItem(h.id);
                                                            }}
                                                            className="flex-shrink-0 p-1.5 rounded-lg bg-red-900/30 text-red-400 self-start"
                                                            title="기록 삭제">
                                                            <Icons.Trash2 size={13}/>
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* AI 생성 버튼 */}
                            <button onClick={generateLogbook} disabled={isGenLog || todayEntries().length === 0}
                                className="w-full bg-[#34C759] text-white rounded-2xl py-4 font-bold text-sm flex items-center justify-center gap-2 disabled:opacity-40 active:scale-[0.98] transition-transform">
                                {isGenLog ? <><Icons.Loader size={18}/> AI가 일지를 작성 중입니다...</> : <><Icons.Sparkles size={18}/> AI 지원일지 자동 작성 (지원업무 포함)</>}
                            </button>

                            {/* 생성 결과 — 실제 보고서 레이아웃 미리보기 */}
                            {logResult && (
                                <div className="bg-white rounded-2xl overflow-hidden">
                                    <div className="bg-gray-100 px-4 py-2.5 border-b border-gray-200 flex items-center justify-between">
                                        <span className="text-xs font-bold text-gray-700">보고서 미리보기</span>
                                        <span className="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium">
                                            {logResult.items.length}개 항목
                                        </span>
                                    </div>

                                    {/* ── 실제 양식 재현 ── */}
                                    <div className="px-3 pb-3 pt-0 bg-white" style={{ fontFamily: '"바탕", Batang, serif', color: '#000' }}>
                                        <img src={BANNER_B64} className="w-full block" alt=""/>
                                        <h1 className="text-[15px] font-bold mt-1.5 mb-2.5">현장 안전관리 일일 지원결과 공유</h1>

                                        {/* Ⅰ. 지원 개요 */}
                                        <p className="text-[12.5px] font-bold mb-1">Ⅰ. 지원 개요</p>
                                        <div className="pl-3 mb-3 space-y-0.5">
                                            {[['현장명', logMeta.site], ['지원일자', logMeta.date], ['지원인원', logMeta.supporter]]
                                                .map(([k, v]) => (
                                                <p key={k} className="text-[11.5px]">○ {k} : {v || <span className="text-gray-400">(미입력)</span>}</p>
                                            ))}
                                        </div>

                                        {/* Ⅱ. 지원 업무 */}
                                        <p className="text-[12.5px] font-bold mb-1">
                                            Ⅱ. 지원 업무 <span className="text-[10px] font-normal text-gray-600">(해당 현장으로부터 지원 요청 받은 사항)</span>
                                        </p>
                                        <div className="border mb-3 px-2.5 py-2" style={{ borderColor: '#7F9DB9' }}>
                                            {(logMeta.requests || '').split('\n').map(s => s.trim()).filter(Boolean).length === 0
                                                ? <p className="text-[11px] text-gray-400">(지원 업무 미입력 — AI 초안 버튼을 눌러보세요)</p>
                                                : (logMeta.requests || '').split('\n').map(s => s.trim()).filter(Boolean).map((r, i) => (
                                                    <p key={i} className="text-[11.5px] leading-relaxed">{i + 1}) {r}</p>
                                                ))}
                                        </div>

                                        {/* Ⅲ. 지원 결과 */}
                                        <p className="text-[12.5px] font-bold mb-1">Ⅲ. 지원 결과</p>
                                        <table className="w-full border-collapse" style={{ tableLayout: 'fixed' }}>
                                            <thead>
                                                <tr>
                                                    <th className="text-[11px] font-bold py-1 border"
                                                        style={{ width: '52px', background: '#DCE6F2', borderColor: '#7F9DB9' }}>구분</th>
                                                    <th className="text-[11px] font-bold py-1 border"
                                                        style={{ background: '#DCE6F2', borderColor: '#7F9DB9' }}>지원 결과</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {['오전', '오후'].map(slot => {
                                                    const items = logResult.items.filter(it => (it.slot || '오전') === slot);
                                                    if (!items.length) return null;
                                                    return (
                                                        <tr key={slot}>
                                                            <td className="text-[11px] font-bold text-center align-middle border"
                                                                style={{ borderColor: '#7F9DB9' }}>{slot}</td>
                                                            <td className="border px-2 py-2 align-top" style={{ borderColor: '#7F9DB9' }}>
                                                                {(() => {
                                                                    const groups = [];
                                                                    items.forEach((it, i) => {
                                                                        const key = (it.group ?? null) !== null ? `g${it.group}` : `s${i}`;
                                                                        let g = groups.find(x => x.key === key && x.items.length < 2);
                                                                        if (!g) { g = { key, items: [] }; groups.push(g); }
                                                                        g.items.push(it);
                                                                    });
                                                                    return groups.map((g, gi) => {
                                                                        const head = g.items[0];
                                                                        const pics = g.items.filter(x => x.entry?.image);
                                                                        return (
                                                                            <div key={gi} className="mb-2.5">
                                                                                <p className="text-[11.5px] leading-snug">• {head.line}</p>
                                                                                {head.sub && <p className="text-[11.5px] leading-snug pl-2.5">→ {head.sub}</p>}
                                                                                {pics.length > 0 && (
                                                                                    <div className={`mt-1 flex justify-center gap-2 ${pics.length >= 2 ? '' : ''}`}>
                                                                                        {pics.slice(0, 2).map((p, i) => (
                                                                                            <img key={i} src={p.entry.image} alt=""
                                                                                                 className="object-contain"
                                                                                                 style={{ maxWidth: pics.length >= 2 ? '46%' : '68%', maxHeight: '140px' }}/>
                                                                                        ))}
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                        );
                                                                    });
                                                                })()}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>

                                        {logResult.note && (
                                            <p className="text-[10.5px] text-gray-600 italic mt-2">※ 특이사항 : {logResult.note}</p>
                                        )}

                                        {/* 하단 절차 */}
                                        <p className="text-[10px] font-bold text-gray-700 mt-3 mb-1">※ 지원업무 수행 및 결과공유 절차</p>
                                        <div className="grid grid-cols-3 gap-1.5">
                                            {[['PM 의견을 받아, 지원인원에게 일일 안전관리 업무내용 전달', '[현장 공무팀 → 지원인원]'],
                                              ['일일 안전관리 지원 수행하고, 지원결과 작성하여 공무팀 제출', '[지원인원 → 현장 공무팀]'],
                                              ['개별 지원결과를 취합하여 PM 보고 및 피드백 공유', '[현장 공무팀 → PM]']].map(([b, cap], i) => (
                                                <div key={i}>
                                                    <div className="border text-[8px] leading-tight p-1 text-center"
                                                         style={{ borderColor: '#7F9DB9', background: '#F2F6FA', minHeight: '40px' }}>{b}</div>
                                                    <p className="text-[7.5px] text-center text-gray-500 mt-0.5">{cap}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 액션 버튼 */}
                                    <div className="flex gap-2 p-3 bg-gray-50 border-t border-gray-200">
                                        <button onClick={() => {
                                            const t = logbookAsText();
                                            if (navigator.clipboard?.writeText) {
                                                navigator.clipboard.writeText(t).then(() => alert('일지 내용이 복사되었습니다.\n기존 PPT 양식에 붙여넣기 하세요.'))
                                                    .catch(() => alert('복사 실패. 텍스트를 길게 눌러 직접 복사해주세요.'));
                                            } else {
                                                const ta = document.createElement('textarea');
                                                ta.value = t; document.body.appendChild(ta); ta.select();
                                                try { document.execCommand('copy'); alert('일지 내용이 복사되었습니다.'); } catch(e) { alert('복사에 실패했습니다.'); }
                                                ta.remove();
                                            }
                                        }} className="flex-1 flex items-center justify-center gap-1.5 bg-gray-200 text-gray-700 rounded-xl py-3 text-xs font-bold">
                                            <Icons.Copy size={14}/> 텍스트 복사
                                        </button>
                                        <button onClick={() => { downloadLogbookPPTX().catch(e => { console.error(e); alert("PPT 생성 오류: "+e.message); }); }}
                                            className="flex-1 flex items-center justify-center gap-1.5 bg-[#C43E1C] text-white rounded-xl py-3 text-xs font-bold">
                                            <Icons.Presentation size={14}/> PPT 다운로드
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                )}

                {/* ── 히스토리 모달 ── */}
                {showHistory && (
                    <div className="absolute inset-0 z-50 bg-[#1C1C1E] flex flex-col animate-slide-up">
                        <div className="bg-[#2C2C2E] border-b border-gray-700 p-4 safe-area-top flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <span className="bg-[#FF9500] p-1 rounded-md"><Icons.History size={16} className="text-white"/></span>
                                진단 히스토리
                                <span className="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded-full">{history.length}건</span>
                            </h2>
                            <div className="flex gap-2">
                                {history.length > 0 && (
                                    <button onClick={() => {
                                        if (confirm('전체 히스토리를 삭제하시겠습니까?')) {
                                            if(HGCore.persistHistory(safeStore,[])){historyRef.current=[];setHistory([]);idbClear();}
                                            else setStorageNotice('전체 삭제를 저장하지 못했습니다.');
                                        }
                                    }} className="bg-red-900/40 p-2 rounded-full text-red-400">
                                        <Icons.Trash2 size={18}/>
                                    </button>
                                )}
                                <button onClick={() => setShowHistory(false)} className="bg-[#3A3A3C] p-2 rounded-full text-gray-300">
                                    <Icons.X size={20}/>
                                </button>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto hide-scrollbar">
                            {history.length === 0 ? (
                                <div className="flex flex-col items-center justify-center h-full gap-3 text-gray-500">
                                    <Icons.History size={48} className="opacity-30"/>
                                    <p className="text-sm">아직 진단 기록이 없습니다</p>
                                </div>
                            ) : (
                                <div className="p-4 space-y-3">
                                    {history.map((item) => {
                                        const rc = { '매우위험':'bg-red-500','위험':'bg-orange-500','주의':'bg-yellow-500','양호':'bg-gray-500' }[item.report?.riskLevel] || 'bg-gray-500';
                                        return (
                                            <button key={item.id} onClick={() => {
                                                setActiveEntry(item);
                                                setReportData(item.report);
                                                setCapturedImage(item.image);
                                                setShowHistory(false);
                                                setShowReport(true);
                                            }} className="w-full bg-[#2C2C2E] rounded-2xl overflow-hidden border border-gray-700 active:opacity-70 text-left">
                                                <div className={`h-1.5 ${rc}`}/>
                                                <div className="flex gap-3 p-3">
                                                    {item.image && <img src={item.image} className="w-16 h-16 rounded-xl object-cover flex-shrink-0 bg-black"/>}
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-2 mb-1">
                                                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full text-white ${rc}`}>{item.report?.riskLevel||'-'}</span>
                                                            <span className="text-xs text-gray-400 truncate">{item.siteName}</span>
                                                        </div>
                                                        <p className="text-xs text-gray-300 line-clamp-2 leading-relaxed">{item.report?.summary?.substring(0,80)}...</p>
                                                        <div className="flex items-center gap-3 mt-1.5">
                                                            <span className="text-[10px] text-gray-500">{item.date}</span>
                                                            {item.gps && <span className="text-[10px] text-blue-400 flex items-center gap-0.5"><Icons.MapPin size={10}/>{item.gps.lat}</span>}
                                                            <span className="text-[10px] text-orange-400">{item.report?.hazards?.length||0}건</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                )}

                {isKeyModalOpen && (
                    <div className="absolute inset-0 z-[60] bg-black/85 flex items-center justify-center p-4">
                        <div className="ios-glass-dark w-full max-w-sm p-5 rounded-3xl max-h-[88dvh] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4"><h3 className="text-lg font-bold">분석 설정</h3><button aria-label="설정 닫기" onClick={()=>setIsKeyModalOpen(false)}><Icons.X size={20}/></button></div>
                            <label className="text-sm block">개인 Gemini API 키
                                <input type="password" ref={apiKeyInputRef} defaultValue={apiKey} autoComplete="off" spellCheck="false" placeholder="AIza..." className="mt-2 w-full bg-black/30 border border-white/20 rounded-xl p-3 text-white text-sm"/>
                            </label>
                            <p className="text-xs text-gray-400 mt-2">키는 현재 화면의 메모리에서만 사용합니다. 새로 열면 다시 입력하세요.</p>
                            <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" className="text-xs text-blue-300 inline-block mt-2">Google AI Studio에서 키 관리</a>
                            <label className="text-sm block mt-4">분석 모델
                                <select value={selectedModel} onChange={e=>{setSelectedModel(e.target.value);ACTIVE_MODEL=e.target.value;}} className="mt-2 w-full bg-gray-900 p-3 rounded-xl">
                                    {GEMINI_MODELS.map(m=><option key={m} value={m}>{m}</option>)}
                                </select>
                            </label>
                            <label className="text-sm block mt-4">점검 작업
                                <select value={workType} onChange={e=>setWorkType(e.target.value)} className="mt-2 w-full bg-gray-900 p-3 rounded-xl">
                                    {['종합 점검','중장비·차량','추락·개구부','비계·동바리','용접·화기','전기·분전함','밀폐공간'].map(t=><option key={t}>{t}</option>)}
                                </select>
                            </label>
                            <label className="mt-4 flex gap-3 items-start text-sm bg-blue-950/60 rounded-xl p-3">
                                <input type="checkbox" checked={cloudConsent} onChange={e=>{setCloudConsent(e.target.checked);if(!e.target.checked){autoCheckRef.current=false;setAutoCheck(false);autoRequestRef.current?.abort();cancelGemini();}}} className="mt-1"/>
                                <span>사진·점검 메모를 Google Gemini로 전송하여 분석합니다.<span className="block text-xs text-gray-400 mt-1">자동 재점검을 켜면 화면이 열린 동안 최소 30초 간격으로 촬영·전송합니다. 이용 한도와 요금은 계정에 따릅니다.</span></span>
                            </label>
                            <p className="text-xs text-gray-400 mt-3">기기 내 감지는 사진을 전송하지 않습니다. 자동 재점검 사진은 ‘기록에 저장’을 누르기 전까지 현재 화면에만 남습니다.</p>
                            <p className="text-[10px] text-gray-400 mt-2">진단 기록은 최근 40건을 유지합니다. 브라우저 기록 삭제나 저장공간 정리 시 사라질 수 있으므로 원본과 필요한 일지는 별도로 보관하세요.</p>
                            <div className="mt-4 border-t border-white/10 pt-4">
                                <p className="text-sm">위치 기록 {gpsCoords?'사용 중':'꺼짐'}</p>
                                <button onClick={()=>{
                                    if(gpsCoords){setGpsCoords(null);return;}
                                    navigator.geolocation?.getCurrentPosition(p=>setGpsCoords({lat:p.coords.latitude.toFixed(5),lng:p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy),at:new Date().toISOString()}),()=>setStorageNotice('위치 정보를 가져오지 못했습니다.'),{timeout:10000,maximumAge:0});
                                }} className="text-xs mt-2 px-3 py-2 bg-white/10 rounded-xl">{gpsCoords?'위치 기록 끄기':'현재 위치 1회 가져오기'}</button>
                                <p className="text-[10px] text-gray-500 mt-2">현재 기기에서 직접 촬영한 사진에만 수집 시각과 함께 기록합니다.</p>
                            </div>
                            <div className="flex gap-3 mt-5">
                                <button onClick={()=>{setApiKey('');setCloudConsent(false);autoCheckRef.current=false;setAutoCheck(false);autoRequestRef.current?.abort();cancelGemini();setIsKeyModalOpen(false);}} className="flex-1 py-3 text-sm text-gray-300 bg-white/10 rounded-xl">키 지우기</button>
                                <button onClick={()=>{
                                    setApiKey((apiKeyInputRef.current?.value||'').trim());
                                    try{safeStore.setItem('gemini_active_model_v3',ACTIVE_MODEL);}catch{}
                                    setIsKeyModalOpen(false);
                                }} className="flex-1 py-3 rounded-xl bg-blue-600 font-bold text-sm">설정 적용</button>
                            </div>
                        </div>
                    </div>
                )}


            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
